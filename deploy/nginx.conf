# /etc/nginx/sites-available/support-hub  (then: sudo ln -s to sites-enabled, sudo nginx -t, sudo systemctl reload nginx)
# Get the certificate first:  sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d hub.example.com
server {
    listen 80;
    server_name hub.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name hub.example.com;
    ssl_certificate     /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # Superset can be slow; zips of many files too
    }
}
# In .env on the server set: COOKIE_SECURE=true  and  TRUST_PROXY=true
