<style>
/* Layout: fixed left rail of modules + admin, slim top bar, one working pane. Login is a full-screen gate. */
:root{
  --bg:#e9e9e7; --surface:#ffffff; --surface2:#f1f1ef; --line:#c9c9c4; --fg:#111111; --muted:#4d4d4a;
  --accent:#ffc800; --accent-fg:#111111; --accent-soft:#fff0a8; --accent-ink:#7a5a00;
  --rail:#111111; --rail-fg:#f1f1ee; --rail-muted:#9a9a94; --rail-hover:#222222;
  --on-good:#ffffff; --good:#0f7a36; --good-soft:#d3f1de; --warn:#b34700; --warn-soft:#ffe1c4; --on-bad:#ffffff; --bad:#b3180f; --bad-soft:#fcd9d5; --info:#1f5fbf; --info-soft:#d8e6fb;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.08);
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --surface:#1a1a1a; --surface2:#242424; --line:#3d3d3a; --fg:#f4f4f1; --muted:#b4b4ae;
  --accent:#ffd21f; --accent-fg:#111111; --accent-soft:#3a3200; --accent-ink:#ffd21f;
  --rail:#000000; --rail-fg:#f4f4f1; --rail-muted:#9a9a94; --rail-hover:#1c1c1c;
  --on-good:#06210f; --good:#5ee08a; --good-soft:#12361f; --warn:#ffa05c; --warn-soft:#432000; --on-bad:#2a0a07; --bad:#ff8f86; --bad-soft:#4a1b17; --info:#7fb0ff; --info-soft:#14284a;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#1a1a1a; --surface2:#242424; --line:#3d3d3a; --fg:#f4f4f1; --muted:#b4b4ae;
  --accent:#ffd21f; --accent-fg:#111111; --accent-soft:#3a3200; --accent-ink:#ffd21f;
  --rail:#000000; --rail-fg:#f4f4f1; --rail-muted:#9a9a94; --rail-hover:#1c1c1c;
  --on-good:#06210f; --good:#5ee08a; --good-soft:#12361f; --warn:#ffa05c; --warn-soft:#432000; --on-bad:#2a0a07; --bad:#ff8f86; --bad-soft:#4a1b17; --info:#7fb0ff; --info-soft:#14284a;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* icons */
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;width:1em;overflow:hidden;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle;flex:none}
.ms.lg{font-size:30px}
.btn .ms{font-size:18px;margin-right:4px}
/* login */
.gate2{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px max(16px,env(safe-area-inset-left,0px));background-color:#101010;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;color:#f1f1ee}
.g2card{width:100%;max-width:440px;padding:28px;display:grid;gap:16px;border-top:6px solid var(--accent);color:var(--fg)}
.g2top{display:flex;gap:14px;align-items:center}
.g2top .logo{width:52px;height:52px;border-radius:14px}
.g2top .logo .ms{font-size:30px}
.g2top b{font-family:var(--f-display);font-size:22px}
.acct{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.acct:hover,.acct:focus-visible{border-color:var(--fg)}
.acct .avatar{width:30px;height:30px}
.acct .rl{margin-left:auto}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker label{cursor:pointer;position:relative}
.picker input{position:absolute;opacity:0}
.picker span.pk{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.picker input:checked+span.pk{background:var(--accent);border-color:var(--fg);color:var(--accent-fg)}
.picker input:focus-visible+span.pk{outline:3px solid var(--info);outline-offset:2px}
.gate{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.gate-art{background:var(--accent);color:var(--accent-fg);padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.gate-art h1{font-size:clamp(32px,4.4vw,54px);line-height:1.02;max-width:12ch}
.gate-art .logo{background:var(--accent-fg)!important;color:var(--accent)!important}.gate-art ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;font-family:var(--f-mono);font-size:12.5px;opacity:.9}
.gate-art li::before{content:"› ";}
.gate-form{display:flex;align-items:center;justify-content:center;padding:32px max(20px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.login-card{width:100%;max-width:400px;padding:28px;display:grid;gap:16px}
.login-card h2{font-size:24px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.inp{border-color:#8d8d88}.inp:focus{border-color:var(--fg)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.demo-users{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--fg)}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
.rail{grid-row:1/3;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;min-height:0;overflow:auto}
.brand{color:var(--rail-fg);height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-size:14px;font-weight:700}
.logo svg{width:68%;height:68%;display:block}
.pwwrap{position:relative;display:block}.pwwrap .inp{padding-right:46px}

async function liveLogin(e){

  await api('POST','/api/auth/login',{email:$('#em').value.trim(),password:$('#pw').value},{noAuthRedirect:true});

 }catch(x){renderLogin(x.message)}
}

}

/* Builds the Superset chart/data body. vals is a list used for every search column, or an object {column: [values]} where only the columns present are filtered.

function buildBody(q,vals,range){
 const e=supActive(q),ds=num(e.datasource),dash=num(e.dashboard),lim=Number(e.rowLimit)||1000,rg=range||'No filter',ob=q.orderBy||[];

 const flt=[...mk(),...fixed];
 if(q.dateCol)flt.push({col:q.dateCol,op:'TEMPORAL_RANGE',val:rg});
 const adhoc=[...(q.dateCol?[{clause:'WHERE',comparator:rg,expressionType:'SIMPLE',operator:'TEMPORAL_RANGE',subject:q.dateCol}]:[]),
  ...fixed.map(f=>({clause:'WHERE',comparator:null,expressionType:'SIMPLE',operator:f.op,operatorId:f.op.replace(/ /g,'_'),sqlExpression:null,subject:f.col}))];
 return {datasource:{id:ds,type:'table'},force:false,
  queries:[{filters:flt,extras:{having:'',where:''},applied_time_extras:{},columns:q.columns,orderby:ob,annotation_layers:[],row_limit:lim,series_limit:0,order_desc:true,url_params:{},custom_params:{},custom_form_data:{},post_processing:[],time_offsets:[]}],
  form_data:{datasource:ds+'__table',viz_type:'table',slice_id:num(e.slice),url_params:{},query_mode:'raw',groupby:[],all_columns:q.columns,percent_metrics:[],
   adhoc_filters:adhoc,order_by_cols:ob.map(o=>JSON.stringify(o)),row_limit:lim,order_desc:true,dashboards:dash===undefined?[]:[dash],extra_form_data:{filters:mk()},dashboardId:dash,force:false,result_format:'json',result_type:'full'},
  result_format:'json',result_type:'full'};
}
/* Reads a pasted curl and returns the settings in it. The Cookie header is never read. */
function parseCurl(text){
 const um=String(text).match(/https?:\/\/[^\s'"\\]+/);if(!um)return {error:'No URL found in that curl.'};
 let url;try{url=new URL(um[0])}catch(e){return {error:'The URL in that curl is not valid.'}}
 const i=text.indexOf('--data'),a=text.indexOf('{',i),b=text.lastIndexOf('}');
 if(i<0||a<0||b<a)return {error:'No JSON body (--data) found in that curl.'};
 let j;try{j=JSON.parse(text.slice(a,b+1))}catch(e){return {error:'The --data body is not valid JSON.'}}
 const qq=(j.queries||[])[0]||{},fd=j.form_data||{},fl=qq.filters||[];
 return {base:url.origin,endpoint:url.pathname,datasource:j.datasource&&j.datasource.id,slice:fd.slice_id,dashboard:fd.dashboardId,
  rowLimit:qq.row_limit||fd.row_limit,columns:qq.columns||[],orderBy:qq.orderby||[],fixedFilters:fl.filter(f=>!('val' in f)).map(f=>({col:f.col,op:f.op})),searchCols:[...new Set(fl.filter(f=>f.op==='IN').map(f=>f.col))],dateCol:(fl.find(f=>f.op==='TEMPORAL_RANGE')||{}).col||''};
}

function periodRange(k,now0){

 const t=new Date(now0||Date.now());t.setHours(0,0,0,0);

function demoHistory(a,pr){

 const days=Math.max(1,Math.round((end-start)/864e5)),n=Math.min(80,Math.max(6,days*2)),seed=hash(a.PARTNER_ID+pr.range),rows=[];

   WALLET_ID:String(300000+k2%99999),WALLET_PARTNER_ID:a.PARTNER_ID,WALLET_TYPE_ID:1,WALLET_SIDE:side,WALLET_NET_AMOUNT:ok?net:0,TRANSACTION_AMOUNT:side==='OP'?-amt:amt,
   OP_FEE:side==='OP'?fee:0,DP_FEE:0,OP_COMMISSION:0,OP_TXN_FEE:0,DP_TXN_FEE:0,OU_FULLNAME:a.FIRST_NAME+' '+a.Name,OU_MSISDN:a.MOBILE_NUMBER,
   OP_WALLET_ACTION:side==='OP'?'DR':null,DP_WALLET_ACTION:side==='DP'?'CR':null,
   OTHER_USER_MSISDN:'592'+String(6000000+k2%999999),OTHER_USER_FULL_NAME:fullName(k2),MASTER_TXN_ID:String(20400000000000+(k%99999999)),
   PARTNER_SERVICE_NAME:svc==='DIRECT_BILL_PAYMENT'?pick(['Internet Payment','Membership Dues'],k2>>9):null});
  r._net=ok?net:0;rows.push(r);
 }

 <div id="tres"></div>`;

 const res=()=>S.cache.txns;
 const acct=()=>res()&&res().rows.find(r=>r.USER_ID===S.sel.txnAcct);
 const filtered=()=>{
  const r=res();if(!r)return [];
  const from=f.from?Date.parse(f.from+'T00:00:00Z'):null,to=f.to?Date.parse(f.to+'T00:00:00Z')+86400000:null,tx=f.text.toLowerCase();
  return r.rows.filter(x=>(!f.status.length||f.status.includes(x.STATUS))&&(f.type==='All'||x.Account_type===f.type)
   &&(from==null||x.CREATED_DATE>=from)&&(to==null||x.CREATED_DATE<to)
   &&(!tx||[x.USER_ID,x.USER_NAME,x.FIRST_NAME,x.Name,x.PARTNER_ID,x.CREATED_BY].join(' ').toLowerCase().includes(tx)));
 };

 const drawTable=()=>{
  const rows=filtered(),box=$('#ttab');if(!box)return;

  box.innerHTML=rows.length?`<div class="tablewrap"><table style="min-width:1000px"><thead><tr><th style="width:64px">Select</th><th>User ID</th><th>Name</th><th>Username</th><th>Mobile</th><th>Email</th><th>Account type</th><th>Status</th><th>Created</th><th>Created by</th><th>Last modified</th></tr></thead><tbody>
   ${rows.map(r=>`<tr class="click" data-row="${esc(r.USER_ID)}"><td><input type="radio" name="tacct" data-pk="${esc(r.USER_ID)}" ${S.sel.txnAcct===r.USER_ID?'checked':''} aria-label="Select ${esc(r.USER_NAME)}"></td><td class="mono">${esc(r.USER_ID)}<div class="muted">Partner ${esc(r.PARTNER_ID)}</div></td><td><b>${esc(r.FIRST_NAME)} ${esc(r.Name)}</b></td><td class="mono">${esc(r.USER_NAME)}</td><td class="mono">${esc(r.MOBILE_NUMBER||'—')}</td><td>${esc(r.EMAIL_ID||'—')}</td><td>${esc(r.Account_type)}</td><td>${pill(r.STATUS)}</td><td class="num">${fmtDate(r.CREATED_DATE)}</td><td class="mono">${esc(r.CREATED_BY||'—')}</td><td class="num">${fmtDate(r.LAST_MODIFIED_DATE)}</td></tr>`).join('')}</tbody></table></div>`
   :'<div class="card empty">No accounts match these filters.</div>';
  $$('[data-row]',box).forEach(tr=>tr.onclick=()=>{const id=tr.dataset.row;if(S.sel.txnAcct===id)return;S.sel.txnAcct=id;S.cache.hist=null;const hr=$('#hres');if(hr)hr.innerHTML='';drawTable();upd2()});
 };
 const upd2=()=>{
  const a=acct(),el=$('#hsel');
  if(el)el.innerHTML=a?`<b>${esc(a.FIRST_NAME)} ${esc(a.Name)}</b> · username <span class="mono">${esc(a.USER_NAME)}</span> · Partner ID <span class="mono">${esc(a.PARTNER_ID)}</span>`:'<span class="muted">No account selected. Tick one in the table above.</span>';

 const drawHist=()=>{
  const box=$('#hres'),c=S.cache.hist;if(!box)return;if(!c){box.innerHTML='';return}

   ${pv.map(r=>`<tr><td class="num">${esc(fmtIso(r.TRANSACTION_DATE))}</td><td class="mono">${esc(r.TRANSACTION_ID)}</td><td>${esc(r.SERVICE_NAME)}</td><td>${pill(r.STATUS_TYPE)}</td><td>${esc(r.WALLET_SIDE)}</td><td class="r num">${fmtN(r.TRANSACTION_AMOUNT)}</td><td class="r num">${fmtN(r.WALLET_NET_AMOUNT)}</td><td class="r num">${fmtN(r.WALLET_BAL_BEFORE)}</td><td class="r num">${fmtN(r.WALLET_BAL_AFTER)}</td><td>${esc(r.OTHER_USER_FULL_NAME||'—')}</td></tr>`).join('')}</tbody></table></div>

 const pull=async()=>{
  const a=acct();if(!a)return;
  const hr=$('#hres'),go=$('#h2go'),sec=Math.max(5,Number(h.timeoutSec)||60);
  if(!LIVE&&!supUrl(h)){hr.innerHTML=`<div class="diag"><b>No ${h.env.toUpperCase()} URL</b><span>The transaction history connection has no URL yet.${can('admin')?' Add it under Data Sources.':' Ask an admin to add it.'}</span></div>`;return}
  const per=$('#h2p').value,pr=periodRange(per),label=PERIODS.find(p=>p[0]===per)[1];
  S.sel.txnPer=per;S.cache.hist=null;
  log('search','txns',`Transaction history: ${a.USER_NAME} (Partner ID ${a.PARTNER_ID}), ${label}`);
  const ctl=new AbortController(),t0=Date.now();let why='';
  go.disabled=true;
  hr.innerHTML=`<div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b>Pulling transactions…</b><span class="mono" id="hel">0s of ${sec}s</span></div><div class="bar"><i id="hbar" style="width:0"></i></div>
   <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span class="muted" style="font-size:13px">Long periods can take a while. This stops after ${sec} seconds.</span><button class="btn ghost sm" id="hcx" type="button">Cancel</button></div></div>`;
  const tick=setInterval(()=>{const s=Math.min(sec,Math.floor((Date.now()-t0)/1000)),e=$('#hel'),b=$('#hbar');if(e)e.textContent=s+'s of '+sec+'s';if(b)b.style.width=(s/sec*100)+'%'},250);
  const to=setTimeout(()=>{why='timeout';ctl.abort()},(sec+(LIVE?10:0))*1000);
  $('#hcx').onclick=()=>{why='cancel';ctl.abort()};
  try{
   let c;
   if(LIVE){const d=await api('POST','/api/txns/history',{partnerId:a.PARTNER_ID,period:per},{signal:ctl.signal});c={acct:a.USER_ID,pid:a.PARTNER_ID,per,label,...d}}
   else{
    const body=buildBody(h,[a.PARTNER_ID],pr.range);
    const rows=await fetchHistory(body,demoHistory(a,pr),ctl.signal);
    c={acct:a.USER_ID,pid:a.PARTNER_ID,per,label,...histSummary(rows),all:rows,at:now(),range:pr.range,env:h.env,rowLimit:Number(supActive(h).rowLimit)||0};
   }
   S.cache.hist=c;
   if($('#hres'))drawHist();
  }catch(e){
   if(e&&e.code==='timeout')why='timeout';
   const box=$('#hres');
   if(box)box.innerHTML=why==='timeout'
    ?`<div class="diag"><b>The request timed out after ${sec} seconds</b><span>Superset did not answer in time. Try a shorter period.${can('admin')?' You can raise the timeout under Data Sources.':' An admin can raise the timeout.'}</span></div>`
    :why==='cancel'?'<div class="card empty">Cancelled.</div>':`<div class="diag"><b>Could not pull transactions</b><span>${esc(e.message||'Unknown error')}</span></div>`;
   if(why==='timeout')log('error','txns',`Transaction history timed out after ${sec}s: ${a.USER_NAME}, ${label}`);
  }finally{clearInterval(tick);clearTimeout(to);const g=$('#h2go');if(g)g.disabled=!acct()}
 };

 const drawRes=()=>{
  const box=$('#tres');if(!box)return;const r=res();
  if(!r){box.innerHTML='<div class="card empty">Enter a username or mobile number above to pull accounts.</div>';return}
  const searched=r.vals.map(x=>'"'+esc(x)+'"').join(' and ');
  if(!r.rows.length){box.innerHTML=`<div class="card empty"><b>No accounts found for "${esc(r.val)}"</b><div>Searched ${searched} on ${esc(q.searchCols.join(' and '))}. Check the number and try again.</div></div>`;return}
  const statuses=[...new Set(r.rows.map(x=>x.STATUS))],types=[...new Set(r.rows.map(x=>x.Account_type))];

  box.innerHTML=`<div style="display:grid;gap:14px;grid-template-columns:minmax(0,1fr)">
  ${LIVE?'':'<div class="src"><span><b>Preview data.</b> This page is not connected to Superset here, so these accounts and transactions are made up to show the layout.</span></div>'}
  ${r.truncated?`<div class="diag"><b>Row limit reached</b><span>Superset returned its maximum of ${fmtN(r.limit)} rows, so some accounts may be missing. Use a longer number.</span></div>`:''}
  <div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h3>${r.rows.length} account${r.rows.length===1?'':'s'} found</h3><div class="muted" style="font-size:13px">Searched ${searched} · ${r.env.toUpperCase()} · pulled ${esc(r.at)} · <span id="tcount"></span></div></div>${exportBtn('txns')}</div>
   <div class="toolbar">
    <div class="field" style="flex:2 1 260px"><label>Status</label><div class="picker" style="gap:6px">${statuses.map(s=>`<label><input type="checkbox" data-st="${esc(s)}" ${f.status.includes(s)?'checked':''}><span class="chip" style="display:inline-block;cursor:pointer">${esc(s)} · ${cnt(s)}</span></label>`).join('')}</div></div>
    <div class="field"><label for="ft">Account type</label><select class="inp" id="ft"><option>All</option>${types.map(t=>`<option ${f.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div class="field"><label for="ff1">Created from</label><input class="inp" id="ff1" type="date" value="${esc(f.from)}"></div>
    <div class="field"><label for="ff2">Created to</label><input class="inp" id="ff2" type="date" value="${esc(f.to)}"></div>
    <div class="field"><label for="fx">Find in results</label><input class="inp" id="fx" value="${esc(f.text)}" placeholder="Name, ID, partner…"></div>
    <button class="btn ghost" type="button" id="fclr">Clear filters</button></div></div>
  <div id="ttab"></div>
  <div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3>Transaction history</h3><span style="display:flex;gap:6px">${envPill(h)}</span></div>
   <div id="hsel"></div>
   <div class="toolbar"><div class="field" style="flex:0 1 240px"><label for="h2p">Period</label><select class="inp" id="h2p">${PERIODS.map(p=>`<option value="${p[0]}" ${(S.sel.txnPer||'30')===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></div>
    <button class="btn" id="h2go" type="button">${ic('cloud_download')}Pull transactions</button></div>
   <div id="hres"></div></div></div>`;
  $$('[data-st]',box).forEach(c=>c.onchange=()=>{f.status=c.checked?[...f.status,c.dataset.st]:f.status.filter(x=>x!==c.dataset.st);drawTable()});
  $('#ft').onchange=e=>{f.type=e.target.value;drawTable()};

  $('#fx').oninput=e=>{f.text=e.target.value;drawTable()};
  $('#fclr').onclick=()=>{S.filters.txns={status:[],type:'All',from:'',to:'',text:''};Object.assign(f,S.filters.txns);drawRes()};

  wireExport(box,'txns',()=>{const rows=filtered();
   return {filename:`accounts_${r.val.replace(/[^\w-]/g,'')}_${new Date().toISOString().slice(0,10)}.csv`,
    data:toCsv(LOOKUP_COLS,rows.map(x=>({...x,CREATED_DATE:fmtIso(x.CREATED_DATE),LAST_MODIFIED_DATE:fmtIso(x.LAST_MODIFIED_DATE)}))),detail:`Downloaded ${rows.length} account row(s) for "${r.val}"`}});
  drawTable();upd2();drawHist();
 };

 const run=async(pre)=>{
  const val=$('#tq').value.trim();S.sel.txnQ=val;
  if(val.length<q.minChars){$('#terr').textContent=`Enter at least ${q.minChars} characters of the username or mobile number.`;return}
  if(!LIVE&&!supUrl(q)){$('#terr').textContent=`The ${q.env.toUpperCase()} connection has no URL yet.`+(can('admin')?' Add it under Data Sources.':' Ask an admin to add it.');return}
  $('#terr').textContent='';
  const vals=variants(val);
  log('search','txns','Account lookup: "'+val+'"');
  $('#tres').innerHTML='<div class="card empty">Looking up accounts…</div>';
  let d;
  try{
   if(LIVE)d=await api('POST','/api/txns/lookup',{value:val});
   else{await new Promise(r=>setTimeout(r,450));d={rows:lookupDemo(q,vals),vals,env:q.env,at:now()}}
  }catch(x){if($('#tres'))$('#tres').innerHTML=`<div class="diag"><b>Lookup failed</b><span>${esc(x.message||'Unknown error')}</span></div>`;return}
  if(S.route!=='txns'||!$('#tres'))return;
  const rows=d.rows;
  S.cache.txns={val,vals:d.vals||vals,rows,at:d.at||now(),env:d.env||q.env,truncated:!!d.truncated,limit:d.limit};S.cache.hist=null;
  S.sel.txnAcct=(pre&&rows.some(r=>r.USER_ID===pre))?pre:(rows.length===1?rows[0].USER_ID:null);
  S.filters.txns={status:[],type:'All',from:'',to:'',text:''};Object.assign(f,S.filters.txns);
  drawRes();
 };
 $('#tf').onsubmit=e=>{e.preventDefault();run()};
 if(S.sel.txnAuto){const id=S.sel.txnAuto;S.sel.txnAuto=null;run(id)}else drawRes();
};

 };

const GPL_COLS=['TRANSACTION_ID','TRANSACTION_DATE','status','partner_msisdn','partner_name','biller_id','biller_name','biller_service_name','amount','Serial_number','UUID','LAST_MODIFIED_DATE','LAST_MODIFIED_BY'];
SUP['gpl.lookup']={module:'gpl',label:'GPL token lookup',desc:'Finds a GPL transaction by Transaction ID or UUID, and any other rows sharing that UUID.',env:'uat',timeoutSec:60,

 const s=hash(val),hx=n=>(hash(val+n)>>>0).toString(16).padStart(8,'0'),byUuid=UUID_RE.test(val);
 const uuid=byUuid?val.toLowerCase():`${hx(1)}-${hx(2).slice(0,4)}-4${hx(3).slice(0,3)}-8${hx(4).slice(0,3)}-${hx(5)}${hx(6).slice(0,4)}`;
 const serial='temp_'+(1000+s%9000),amt=(500+s%900)*100,base=Date.UTC(2026,8,1+s%27,13,18,3);
 const mk=(i,id)=>({TRANSACTION_ID:id,TRANSACTION_DATE:base+i*60000,status:'Success',partner_msisdn:'592'+(6000000+s%999999),partner_name:pick(FIRST,s)+' '+pick(LAST,s>>>3),biller_id:'12',biller_name:'GPL',biller_service_name:'Prepaid',amount:amt,Serial_number:serial,UUID:uuid,LAST_MODIFIED_DATE:null,LAST_MODIFIED_BY:null});
 const id0=byUuid?String(20300000000000+s%99999999):val,dup=s%3===0,rows=[mk(0,id0)];
 if(dup||byUuid&&s%2===0)rows.push(mk(1,String(Number(id0)+1)));
 const none=s%11===0,g=none?null:{account:'0720'+(100000+s%899999)+'-1025623',name:'SAMPLE CUSTOMER',address1:'1 EXAMPLE ROAD',address2:'EXAMPLE TOWN',city:'EXAMPLE CITY',state:'',time:fmtIso(base).replace('T',' '),cashier:'admin',paymentMethod:'cash',tariff:'Domestic',meter:s%5===0?'temp_'+(1000+(s+7)%9000):serial,totalKwh:'0.0',energy:'0.00',fuel:'$0.00',taxRate:'0%',tax:'$0.00',arrears:'$0.00',wallet:money(amt/100),total:money(amt/100),totalNumber:amt/100,reference:uuid};
 const compare=g?{uuid:'match',serial:g.meter===serial?'match':'differ',amount:'match_cents'}:{uuid:'not_found',serial:'unknown',amount:'unknown'};
 return {kind:byUuid?'uuid':'transaction',value:val,rows,truncated:false,limit:1000,env:SUP['gpl.lookup'].env,gplEnv:'uat',at:now(),
  checks:[{uuid,rows,dupCount:rows.length,isDuplicate:rows.length>1,dupRows:rows.length>1?rows:[],dupTransactionIds:rows.map(r=>r.TRANSACTION_ID),dupError:null,gpl:g,gplError:null,gplCode:null,compare}]};
}

/* Preview stand-ins (made-up rows shaped like the real responses). The exported project asks Superset. */
let DEMO_FEES=null,DEMO_LIMITS=null;
function demoFees(){

 const svc=['AGENT_TOPUP','BILLPAYMENT_ENET','BILLPAYMENT_WANSAT','CASH_OUT_CUSTOMER_IN_APP_FINAL','COLLECT_PAY','COLLECT_PAY_DYNAMIC_QR'],snd=['MMGAgent','MMGCustomer','MMGGoldProfile','MMGLiteProfile'],rcv=['MMGBiller','MMGAgent','TopupOnecom'];
 const slabs=[[0,10000],[10000.01,100000]],d2=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 svc.forEach(s=>snd.forEach(a=>rcv.forEach(b=>slabs.forEach(([lo,hi],i)=>{
  const k=hash(s+a+b+i),ff=pick([0,0,20,50],k>>>2),fp=pick([0,1,1.5,2.5,8.5],k>>>5),cf=pick([0,0,10],k>>>7),cp=pick([0,0.5,1,4.5],k>>>9);
  out.push({service_name:s,SENDER_PROFILE:a,RECEIVER_PROFILE:b,start_val:lo,end_val:hi,start_range:d2(lo),end_range:d2(hi),fee_beneficiary:pick(['SENDER','RECEIVER','BOTH'],k>>>3),commission_beneficiary:pick(['BOTH','RECEIVER','SENDER'],k>>>4),
   fee_category:s.startsWith('COLLECT')?'Collection Fee':'Transactional Fee',fee_type:i?'Tier':pick(['Tier','Constant'],k>>>6),fee_fixed_value:ff,fee_fixed_value_display:d2(ff),fee_percentage_value:fp,fee_percentage_display:fp.toFixed(3)+'%',
   commission_fixed_value:cf,commission_fixed_value_display:d2(cf),commission_percentage_value:cp,commission_percentage_display:cp.toFixed(3)+'%'});
 }))));
 return DEMO_FEES=out;
}
function demoLimits(){
 if(DEMO_LIMITS)return DEMO_LIMITS;const out=[],prof=[['26','Biller',6],['2','CustomerFullPriviledge',2],['41','MMGAgent',4],['44','MMGGoldProfile',3],['47','MMGLiteProfile',1]],svc=[[312,'Bill Payment','DIRECT_BILL_PAYMENT'],[400,'Cash Out','CASH_OUT_CUSTOMER_IN_APP_FINAL'],[401,'Cash In','CASH_IN'],[420,'Send Money','P2P_TRANSFER']];
 const m=n=>n==null?null:'$'+Number(n).toLocaleString('en-US');
 prof.forEach(([id,nm,lv])=>svc.forEach(([sid,sn,sc])=>{const k=hash(id+sid),lim=k%3!==0,thr=k%5!==0;if(!lim&&!thr)return;
  out.push({PROFILE_ID:id,PROFILE_NAME:nm,LEVEL_ID:lv,profile_type:0,profile_status:1,profile_soft_deleted:nm==='Biller'?1:0,SERVICE_ID:sid,service_display_name:sn,SERVICE_NAME:sc,service_status:1,IS_FINANCIAL:1,has_threshold:thr?1:0,has_limit:lim?1:0,
   min_send_amt:thr?m(pick([100,500,1000],k>>>2)):null,max_send_amt:thr?m(pick([50000,200000,1000000],k>>>4)):null,max_receive_amt:thr?m(pick([1000,50000,500000],k>>>6)):null,
   daily_limit:lim?m(pick([50000,100000,500000],k>>>3)):null,weekly_limit:lim?m(pick([200000,500000,2000000],k>>>5)):null,monthly_limit:lim?m(pick([800000,2000000,8000000],k>>>7)):null,
   DAILY_TXNS:lim?pick([5,10,25],k>>>8):null,WEEKLY_TXNS:lim?pick([25,50,100],k>>>9):null,MONTHLY_TXNS:lim?pick([100,200,400],k>>>10):null,
   min_wallet_balance:'$0',max_wallet_balance:m(pick([500000,2000000,10000000000],k>>>11)),low_balance_alert:m(pick([0,1000,5000],k>>>12)),REPORT_DOWNLOAD_SIZE:500,profile_last_modified:Date.UTC(2026,9,1+k%20,12,0,0)});}));
 return DEMO_LIMITS=out;
}
const uniq=(rows,c)=>[...new Set(rows.map(r=>r[c]).filter(x=>x!==null&&x!==undefined&&x!=='').map(String))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
async function refOptions(mod,cols){
 const key='refopt_'+mod;if(S.cache[key])return S.cache[key];
 if(LIVE)return S.cache[key]=await api('GET','/api/ref/'+mod+'/options');
 const rows=mod==='fees'?demoFees():demoLimits();
 return S.cache[key]={options:Object.fromEntries(cols.map(c=>[c,uniq(rows,c)])),total:rows.length,truncated:false,env:SUP[mod==='fees'?'fees.rules':'limits.rules'].env};
}
async function refQuery(mod,filters,cols){
 if(LIVE)return api('POST','/api/ref/'+mod+'/query',{filters});
 await new Promise(r=>setTimeout(r,350));
 const rows=(mod==='fees'?demoFees():demoLimits()).filter(r=>cols.every(c=>!filters[c]||String(r[c])===String(filters[c])));
 return {rows,total:rows.length,truncated:false,limit:5000,env:SUP[mod==='fees'?'fees.rules':'limits.rules'].env,at:now()};
}
const dash=x=>x===null||x===undefined||x===''?'—':x;
const feeText=(fixed,fixedD,pct,pctD)=>{const f=Number(fixed)||0,p=Number(pct)||0;return f&&p?`${fixedD} + ${pctD}`:p?pctD:fixedD};
const dl=(id,arr)=>`<datalist id="${id}">${arr.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`;
const secH=t=>`<div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">${t}</div>`;

/* ----- Fees & Commissions ----- */
VIEWS.fees=v=>{
 const FC=['service_name','SENDER_PROFILE','RECEIVER_PROFILE'],st=S.filters.fees||(S.filters.fees={service_name:'',SENDER_PROFILE:'',RECEIVER_PROFILE:'',amount:'',onlyFit:true,text:'',cat:'All',shown:100});
 v.innerHTML=head('Fees & Commissions','What a service costs and pays out, by sender and receiver profile. Enter an amount to see the exact fee and commission.','fees')+`
 <form class="card panel" id="ff" autocomplete="off"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px">

  <div class="toolbar" style="align-items:center"><span class="muted" style="font-size:13px;flex:1 1 280px">Start typing to pick from the list. Leave a box empty to include everything. Each box narrows the result independently.${LIVE?'':' Preview: sample rules.'}</span><button class="btn ghost" type="button" id="f_clr">Clear</button><button class="btn" type="submit">${ic('search')}Show rules</button></div>
  <div class="err" id="f_err"></div></form><div id="fres"></div>`;
 let opts=null;
 refOptions('fees',FC).then(o=>{opts=o.options;if($('#dls'))$('#dls').innerHTML=dl('dl_s',opts.service_name||[])+dl('dl_a',opts.SENDER_PROFILE||[])+dl('dl_b',opts.RECEIVER_PROFILE||[])}).catch(e=>{if($('#f_err'))$('#f_err').textContent='Could not load the lists: '+e.message});
 const amt=()=>{const n=Number(String(st.amount).replace(/[,$\s]/g,''));return st.amount!==''&&!isNaN(n)&&n>=0?n:null};
 const fits=(r,a)=>a!==null&&Number(r.start_val)<=a&&a<=Number(r.end_val);
 const calc=(r,a)=>({fee:(Number(r.fee_fixed_value)||0)+(Number(r.fee_percentage_value)||0)/100*a,com:(Number(r.commission_fixed_value)||0)+(Number(r.commission_percentage_value)||0)/100*a});
 const money2=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
 const view=()=>{const r=S.cache.fees;if(!r)return [];const a=amt(),tx=st.text.toLowerCase();
  return r.rows.filter(x=>(st.cat==='All'||x.fee_category===st.cat)&&(!(st.onlyFit&&a!==null)||fits(x,a))&&(!tx||[x.service_name,x.SENDER_PROFILE,x.RECEIVER_PROFILE,x.fee_beneficiary,x.commission_beneficiary,x.fee_type].join(' ').toLowerCase().includes(tx)))};
 const draw=()=>{
  const box=$('#fres');if(!box)return;const r=S.cache.fees;
  if(!r){box.innerHTML='<div class="card empty">Pick what you want to look at above, then choose Show rules.</div>';return}

   ${r.truncated?`<div class="diag"><b>Row limit reached</b><span>Superset returned its maximum of ${fmtN(r.limit)} rows, so some rules are missing. Narrow the search, or ask an admin to raise the row limit under Data Sources.</span></div>`:''}
   <div class="toolbar"><div class="field"><label for="f_t">Find in results</label><input class="inp" id="f_t" value="${esc(st.text)}"></div>
    <div class="field" style="flex:0 1 200px"><label for="f_c">Category</label><select class="inp" id="f_c"><option>All</option>${cats.map(c=>`<option ${st.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    ${a!==null?`<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="f_o" ${st.onlyFit?'checked':''}> Only rules that cover this amount</label>`:''}</div>
   ${rows.length?`<div class="tablewrap"><table style="min-width:${a!==null?1280:1060}px"><thead><tr><th>Service</th><th>Sender</th><th>Receiver</th><th>Amount range</th><th>Fee</th><th>Fee beneficiary</th><th>Commission</th><th>Commission beneficiary</th><th>Category</th><th>Type</th>${a!==null?`<th class="r">Fee at ${esc(money2(a))}</th><th class="r">Commission at ${esc(money2(a))}</th>`:''}</tr></thead><tbody>

 $('#f_clr').onclick=()=>{Object.assign(st,{service_name:'',SENDER_PROFILE:'',RECEIVER_PROFILE:'',amount:'',text:'',cat:'All',shown:100});S.cache.fees=null;VIEWS.fees(v)};
 $('#ff').onsubmit=async e=>{e.preventDefault();$('#f_err').textContent='';

  const t=$('#l_t');if(t)t.oninput=e=>{st.text=e.target.value;const p=e.target.selectionStart;draw();const n=$('#l_t');if(n){n.focus();n.setSelectionRange(p,p)}};
  $$('[data-g]',box).forEach(b=>b.onclick=()=>{const k=b.dataset.g;st.groups=st.groups.includes(k)?(st.groups.length>1?st.groups.filter(x=>x!==k):st.groups):[...st.groups,k];draw()});
  wireExport(box,'limits',()=>({filename:`thresholds_limits_${new Date().toISOString().slice(0,10)}.csv`,data:toCsv(LIMITS_COLS,rows.map(x=>({...x,profile_last_modified:fmtIso(x.profile_last_modified)}))),detail:`Exported ${rows.length} threshold and limit rows`}));
 };
 $('#l_clr').onclick=()=>{Object.assign(st,{PROFILE_NAME:'',service_display_name:'',text:''});S.cache.limits=null;VIEWS.limits(v)};
 $('#lf').onsubmit=async e=>{e.preventDefault();$('#l_err').textContent='';
  st.PROFILE_NAME=$('#l_p').value.trim();st.service_display_name=$('#l_s').value.trim();st.text='';
  const f={};for(const c of LC){const x=st[c];if(!x)continue;if(opts&&!(opts[c]||[]).includes(x)){$('#l_err').textContent=`"${x}" is not in the list. Pick one of the suggestions.`;return}f[c]=x}
  $('#lres').innerHTML='<div class="card empty">Loading…</div>';
  try{const d=await refQuery('limits',f,LC);if(S.route!=='limits')return;S.cache.limits=d;if(!LIVE)log('search','limits','Thresholds & Limits: '+(Object.entries(f).map(([k,x])=>k+' = '+x).join(', ')||'all')+' → '+d.rows.length+' rows');draw()}
  catch(x){if($('#lres'))$('#lres').innerHTML=`<div class="diag"><b>Could not load</b><span>${esc(x.message)}</span></div>`}
 };
 draw();
};
</script>
<script>
/* ----- Users & Permissions ----- */
function dropUser(uid){S.open.filter(o=>o.user.id===uid).forEach(closeEntry);SESSIONS=SESSIONS.filter(s=>s.uid!==uid)}
const pcols=()=>[...MODULES.map(m=>[m.id,({search:'Search',fees:'Fees',txns:'History',limits:'Limits',giftcards:'Giftcards',gpl:'GPL'}[m.id]||m.name)]),...SPECIAL.map(s=>[s.id,{dl_images:'Images',unmask:'Unmask',export:'Export'}[s.id]]),['admin','Admin']];
VIEWS.users=v=>{
 const sel=USERS.find(u=>u.id===S.sel.permUser)||USERS[0];S.sel.permUser=sel.id;
 const q=(S.filters.pq||'').toLowerCase();
 const list=USERS.filter(u=>!q||(u.name+u.email).toLowerCase().includes(q));
 const has=k=>sel.perms.includes(k);
 const seg=(key,dis)=>{const on=has(key);return `<div class="seg" role="group" aria-label="${esc(key)}"><button class="yes ${on?'on':''}" data-set="${esc(key)}" data-val="1" aria-pressed="${on}" ${dis?'disabled':''}>${ic('check')}Allowed</button><button class="no ${on?'':'on'}" data-set="${esc(key)}" data-val="0" aria-pressed="${!on}" ${dis?'disabled':''}>${ic('block')}Blocked</button></div>`};
 const label=k=>k==='admin'?'Admin access':k.startsWith('export:')?'Export · '+(MODULES.find(m=>m.id===k.slice(7))||{name:k}).name:([...MODULES,...SPECIAL].find(x=>x.id===k)||{name:k}).name;
 const nMods=u=>u.perms.filter(p=>MODULES.some(m=>m.id===p)).length;
 const sess=SESSIONS.filter(x=>x.uid===sel.id).length;
 v.innerHTML=`<div class="page-h"><div><h2>Users & Permissions</h2><p>Pick a person, then set what they can open and what they can export or download. Changes apply on their next page load and are written to the audit log.</p></div>
  <button class="btn" id="addU">${ic('person_add')}Add user</button></div>
 ${S.sel.tempPw?`<div class="diag" style="background:var(--warn-soft)"><b style="color:var(--warn)">Temporary password for ${esc(S.sel.tempPw.name)}</b><span>Copy it now. It is shown once. They must change it when they sign in.</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px"><span class="mono" style="font-size:15px;font-weight:600">${esc(S.sel.tempPw.pw)}</span><button class="btn ghost sm" id="cpw">Copy</button><button class="btn ghost sm" id="dpw">Done</button></div></div>`:''}
 <div id="addForm"></div>
 <div class="permgrid">
  <aside class="card plist">
   <input class="inp" id="pq" placeholder="Search people" value="${esc(S.filters.pq||'')}" aria-label="Search people">
   ${list.map(u=>`<button class="pitem ${u.id===sel.id?'on':''}" data-pick="${u.id}"><span class="avatar">${esc(initials(u.name))}</span><span class="meta"><b>${esc(u.name)}</b><span class="muted" style="font-size:12.5px">${esc(u.role)} · ${nMods(u)}/${MODULES.length} modules</span></span>${u.status==='active'?'':'<span class="pill bad">Off</span>'}</button>`).join('')||'<div class="muted" style="padding:12px">No one matches.</div>'}
  </aside>
  <section class="card panel" style="padding:22px">
   <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <span class="avatar" style="width:52px;height:52px;font-size:17px">${esc(initials(sel.name))}</span>
    <div style="flex:1 1 200px;min-width:0"><h3 style="font-size:22px">${esc(sel.name)}</h3><div class="muted">${esc(sel.email)} · ${sel.status==='active'?'Active':'Disabled'} · ${sess} open session${sess===1?'':'s'}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-tog="${sel.id}">${ic(sel.status==='active'?'person_off':'person')}${sel.status==='active'?'Disable':'Enable'}</button>${LIVE?`<button class="btn ghost sm" data-rpw="${sel.id}">${ic('lock_reset')}Reset password</button>`:''}<button class="btn ghost sm" data-rm="${sel.id}">${ic('delete')}Remove</button></div>
   </div>
   <div class="toolbar" style="margin-top:6px"><div class="field" style="max-width:220px"><label for="rr">Start from a role</label><select class="inp" id="rr">${Object.keys(DEFAULT_PERMS).map(r=>`<option ${r===sel.role?'selected':''}>${r}</option>`).join('')}</select></div><button class="btn ghost" id="rb">Apply role</button></div>

   <div class="pgh"><h3>Modules</h3><div style="display:flex;gap:6px"><button class="btn ghost sm" data-grp="mods" data-val="1">Allow all</button><button class="btn ghost sm" data-grp="mods" data-val="0">Block all</button></div></div>
   ${MODULES.map(m=>`<div class="prow"><span class="pi">${ic(m.ico)}</span><div class="pt"><b>${esc(m.name)}</b><span class="muted" style="font-size:13px">${esc(m.desc)}</span></div>
    <div class="pctl"><div class="pc"><small>Open</small>${seg(m.id)}</div><div class="pc"><small>Export CSV</small>${seg(EXP(m.id),!has(m.id))}</div></div></div>`).join('')}

   <div class="pgh"><h3>Downloads and sensitive data</h3><div style="display:flex;gap:6px"><button class="btn ghost sm" data-grp="act" data-val="1">Allow all</button><button class="btn ghost sm" data-grp="act" data-val="0">Block all</button></div></div>
   ${SPECIAL.map(x=>`<div class="prow"><span class="pi">${ic(x.ico)}</span><div class="pt"><b>${esc(x.name)}</b><span class="muted" style="font-size:13px">${esc(x.desc)}</span></div><div class="pctl"><div class="pc"><small>Permission</small>${seg(x.id)}</div></div></div>`).join('')}

   <div class="pgh"><h3>Administration</h3></div>
   <div class="prow"><span class="pi">${ic('admin_panel_settings')}</span><div class="pt"><b>Admin access</b><span class="muted" style="font-size:13px">Manage users, hub options, sessions, audit log and data sources.</span></div><div class="pctl"><div class="pc"><small>Permission</small>${seg('admin')}</div></div></div>
  </section></div>`;

 const sync=async u=>{if(!LIVE)return;try{await api('PUT','/api/admin/users/'+encodeURIComponent(u.id),{role:u.role,perms:u.perms,status:u.status})}catch(e){toast(e.message||'Could not save the change.')}};
 const setPerm=(u,k,on)=>{
  if(u.id===S.user.id&&k==='admin'&&!on)return toast('You cannot remove your own admin access.');
  const had=u.perms.includes(k);if(had===on)return;
  u.perms=on?[...u.perms,k]:u.perms.filter(x=>x!==k);
  if(!on&&MODULES.some(m=>m.id===k))u.perms=u.perms.filter(x=>x!==EXP(k));
  log(on?'grant':'revoke','admin',`${on?'Granted':'Revoked'} "${label(k)}" ${on?'to':'from'} ${u.name}`);
 };
 $$('[data-set]',v).forEach(b=>b.onclick=async()=>{setPerm(sel,b.dataset.set,b.dataset.val==='1');toast(`${b.dataset.val==='1'?'Allowed':'Blocked'}: ${label(b.dataset.set)} for ${sel.name.split(' ')[0]}`);await sync(sel);renderView()});
 $$('[data-grp]',v).forEach(b=>b.onclick=async()=>{const on=b.dataset.val==='1';
  const keys=b.dataset.grp==='mods'?[...MODULES.map(m=>m.id),...MODULES.map(m=>EXP(m.id))]:SPECIAL.map(x=>x.id);
  keys.forEach(k=>setPerm(sel,k,on));await sync(sel);renderView()});
 $$('[data-pick]',v).forEach(b=>b.onclick=()=>{S.sel.permUser=b.dataset.pick;drawView()});
 $('#pq').oninput=e=>{S.filters.pq=e.target.value;drawView();const el=$('#pq');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
 $$('[data-tog]',v).forEach(b=>b.onclick=async()=>{const u=USERS.find(x=>x.id===b.dataset.tog);
  if(u.id===S.user.id)return toast('You cannot disable your own account.');
  u.status=u.status==='active'?'disabled':'active';
  if(u.status==='disabled')dropUser(u.id);
  log('account','admin',`${u.status==='active'?'Enabled':'Disabled'} ${u.name}`);await sync(u);renderView()});
 $$('[data-rm]',v).forEach(b=>b.onclick=async()=>{const u=USERS.find(x=>x.id===b.dataset.rm);
  if(u.id===S.user.id)return toast('You cannot remove yourself.');
  if(LIVE){try{await api('DELETE','/api/admin/users/'+encodeURIComponent(u.id))}catch(e){return toast(e.message||'Could not remove the user.')}}
  USERS=USERS.filter(x=>x.id!==u.id);dropUser(u.id);S.sel.permUser=null;log('account','admin','Removed '+u.name);renderView()});
 const cpw=$('#cpw');if(cpw){cpw.onclick=()=>{try{navigator.clipboard.writeText(S.sel.tempPw.pw).then(()=>toast('Copied'),()=>toast('Select and copy the password.'))}catch(e){toast('Select and copy the password.')}};$('#dpw').onclick=()=>{S.sel.tempPw=null;drawView()}}
 $$('[data-rpw]',v).forEach(b=>b.onclick=async()=>{try{const d=await api('POST','/api/admin/users/'+encodeURIComponent(b.dataset.rpw)+'/reset-password');S.sel.tempPw={name:sel.name,pw:d.tempPassword};drawView()}catch(e){toast(e.message||'Could not reset the password.')}});
 $('#rb').onclick=async()=>{const r=$('#rr').value;
  if(sel.id===S.user.id&&r!=='Admin')return toast('You cannot lower your own role.');
  if(LIVE){try{await api('PUT','/api/admin/users/'+encodeURIComponent(sel.id),{role:r,applyRoleDefaults:true})}catch(e){return toast(e.message||'Could not change the role.')}return renderView()}
  sel.role=r;sel.perms=[...DEFAULT_PERMS[r]];log('role','admin',`Set ${sel.name} to ${r}`);renderView()};
 $('#addU').onclick=()=>{
  $('#addForm').innerHTML=`<form class="card panel" id="nu"><h3>New user</h3><div class="toolbar">
   <div class="field"><label for="nn">Full name</label><input class="inp" id="nn" required></div>
   <div class="field"><label for="ne">Email</label><input class="inp" id="ne" type="email" required></div>
   <div class="field"><label for="nr">Role</label><select class="inp" id="nr"><option>Agent</option><option>Supervisor</option><option>Admin</option></select></div>
   <button class="btn" type="submit">Create</button><button class="btn ghost" type="button" id="nc">Cancel</button></div>
   <div class="muted" style="font-size:13px">${LIVE?'You will get a temporary password to give them. They must choose their own when they first sign in.':'They get a one-time link to set their own password. You can then fine-tune what they can do.'}</div></form>`;
  $('#nc').onclick=()=>$('#addForm').innerHTML='';
  $('#nu').onsubmit=async e=>{e.preventDefault();const r=$('#nr').value,id='u'+Date.now();
   if(LIVE){try{const d=await api('POST','/api/admin/users',{name:$('#nn').value.trim(),email:$('#ne').value.trim(),role:r});S.sel.permUser=d.user.id;S.sel.tempPw={name:d.user.name,pw:d.tempPassword}}catch(x){return toast(x.message||'Could not create the user.')}return renderView()}
   USERS.push({id,name:$('#nn').value.trim(),email:$('#ne').value.trim(),role:r,perms:[...DEFAULT_PERMS[r]],status:'active',mfa:false,last:'Never'});
   S.sel.permUser=id;log('account','admin','Created user '+$('#nn').value.trim()+' as '+r);renderView()};
 };
};

/* ----- Audit Log ----- */
VIEWS.audit=v=>{
 const f=S.filters.audit||(S.filters.audit={uid:'All',mod:'All',q:''});
 const mods=['All',...new Set(AUDIT.map(a=>a.mod))];
 v.innerHTML=`<div class="page-h"><div><h2>Audit Log</h2><p>Who signed in, what they opened and what they searched, with the exact values used. ${LIVE?'Stored in MongoDB.':'Stored in MongoDB once the cluster is connected.'}</p></div><button class="btn ghost sm" id="ax">Export CSV</button></div>
 <div class="card panel"><div class="toolbar">
  <div class="field"><label for="au">Person</label><select class="inp" id="au"><option value="All">All</option>${USERS.map(u=>`<option value="${u.id}" ${f.uid===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
  <div class="field"><label for="am">Area</label><select class="inp" id="am">${mods.map(m=>`<option ${f.mod===m?'selected':''}>${m}</option>`).join('')}</select></div>
  <div class="field"><label for="aq">Contains</label><input class="inp" id="aq" value="${esc(f.q)}" placeholder="e.g. TXN-88213"></div></div></div>
 <div id="ares"></div>`;
 const draw=()=>{
  const rows=AUDIT.filter(a=>(f.uid==='All'||a.uid===f.uid)&&(f.mod==='All'||a.mod===f.mod)&&(!f.q||(a.detail+a.act).toLowerCase().includes(f.q.toLowerCase())));
  const tone=a=>({login:'good',logout:'neutral',grant:'accent',revoke:'warn',download:'warn',export:'warn',account:'accent',role:'accent'}[a]||'neutral');
  $('#ares').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Time</th><th>Person</th><th>Action</th><th>Area</th><th>Detail</th></tr></thead><tbody>
  ${rows.map(a=>`<tr><td class="mono">${a.t}</td><td>${esc(a.un||uname(a.uid))}</td><td><span class="pill ${tone(a.act)}">${esc(a.act)}</span></td><td>${esc(a.mod)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No events match.</div>';
 };
 $('#au').onchange=e=>{f.uid=e.target.value;draw()};$('#am').onchange=e=>{f.mod=e.target.value;draw()};
 $('#aq').oninput=e=>{f.q=e.target.value;draw()};
 $('#ax').onclick=()=>{const rows=AUDIT.filter(a=>(f.uid==='All'||a.uid===f.uid)&&(f.mod==='All'||a.mod===f.mod)&&(!f.q||(a.detail+a.act).toLowerCase().includes(f.q.toLowerCase()))).map(a=>({Time:a.t,Person:a.un||uname(a.uid),Action:a.act,Area:a.mod,Detail:a.detail}));
  saveFile(`audit_log_${new Date().toISOString().slice(0,10)}.csv`,toCsv(['Time','Person','Action','Area','Detail'],rows),'audit',`Downloaded ${rows.length} audit row(s)`)};draw();
};

/* ----- Sessions ----- */
VIEWS.sessions=v=>{
 v.innerHTML=`<div class="page-h"><div><h2>Active Sessions</h2><p>Everyone signs in with their own session, so one person signing in or out never affects anyone else. End a single session to sign only that device out.</p></div></div>
 <div class="tablewrap"><table><thead><tr><th>Person</th><th>Device</th><th>IP address</th><th>Signed in</th><th>Last active</th><th></th></tr></thead><tbody>
 ${SESSIONS.map(s=>`<tr><td><b>${esc(s.uname||uname(s.uid))}</b></td><td>${esc(s.device)}</td><td class="mono">${s.ip}</td><td class="num">${s.since}</td><td>${s.seen}</td>
 <td class="r">${(s.current||s.id===S.session.id)?'<span class="pill accent">This session</span>':`<button class="btn danger sm" data-end="${s.id}">End session</button>`}</td></tr>`).join('')}</tbody></table></div>
 ${LIVE?'<div class="card panel"><h3>Session rules</h3><div class="muted">Idle timeout and maximum session length are set on the server with SESSION_IDLE_MIN and SESSION_MAX_HOURS.</div></div>':`<div class="card panel"><h3>Session rules</h3>
  ${[['Sign out after 30 minutes of no activity',true],['Require a second factor at sign in',true],['Only allow sign in from office IP ranges',false],['One active session per person',false]].map((r,i)=>`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span>${r[0]}</span><label class="switch"><input type="checkbox" data-rule="${i}" ${r[1]?'checked':''}><i></i></label></div>`).join('')}
  <div class="muted" style="font-size:12.5px">These switches are display only until the auth backend is connected.</div></div>`}`;
 $$('[data-end]',v).forEach(b=>b.onclick=async()=>{
  if(LIVE){try{await api('DELETE','/api/admin/sessions/'+encodeURIComponent(b.dataset.end));toast('Session ended.')}catch(e){toast(e.message||'Could not end the session.')}return renderView()}
  const s=SESSIONS.find(x=>x.id===b.dataset.end);const oe=S.open.find(o=>o.session===s);if(oe)closeEntry(oe);else SESSIONS=SESSIONS.filter(x=>x!==s);log('session','admin','Ended session for '+uname(s.uid));renderView()});
 $$('[data-rule]',v).forEach(i=>i.onchange=()=>log('setting','admin','Session rule '+i.dataset.rule+(i.checked?' on':' off')));
};

/* ----- Data Sources ----- */
VIEWS.sources=v=>{
 v.innerHTML=`<div class="page-h"><div><h2>Data Sources</h2><p>Every module reads from a Superset dataset. Add its curl and the sample data is replaced with live results.</p></div></div>
 <div class="pgh" style="border:0;padding-bottom:0"><h3>Report connections</h3></div>
 <div class="srcgrid">${supCards()}</div>
 <div id="supBox"></div>
 ${LIVE?'<div class="muted">Fees & Commissions, Limits and Giftcards still show sample data. Their queries have not been added yet.</div>':`<div class="pgh" style="border:0;padding-bottom:0"><h3>Other modules</h3></div>
  <div class="srcgrid">${MODULES.filter(m=>!['txns','search'].includes(m.id)).map(m=>`<div class="card srccard"><div style="display:flex;gap:12px;align-items:center"><span class="pi">${ic(m.ico)}</span><div style="min-width:0"><b>${esc(m.name)}</b><div class="mono muted" style="overflow:hidden;text-overflow:ellipsis">${esc(SRC[m.id].replace('Superset · ',''))}</div></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${m.curl?'<span class="pill good"><span class="dot"></span>Curl saved</span>':'<span class="pill warn"><span class="dot"></span>Awaiting curl</span>'}<button class="btn ghost sm" data-curl="${m.id}">${ic('terminal')}${m.curl?'Replace curl':'Add curl'}</button></div></div>`).join('')}</div>
`} <div id="curlBox"></div>
 <div class="two">
  <div class="card panel"><h3>Connect MongoDB</h3>
   <ol class="steps"><li><div><b>Create a cluster</b><div class="muted" style="font-size:13px">An Atlas M0 free cluster is enough to start.</div></div></li>
    <li><div><b>Add a database user</b><div class="muted" style="font-size:13px">Give it read and write on the hub database only.</div></div></li>
    <li><div><b>Allow your server's IP</b><div class="muted" style="font-size:13px">Under Network Access in Atlas.</div></div></li>
    <li><div><b>Paste the connection string</b></div></li></ol>
   ${LIVE?'<div class="muted" style="font-size:13px">The connection string is set with MONGODB_URI on the server. It is never typed into this page.</div>':`<div class="field"><label for="mg">Connection string</label><input class="inp mono" id="mg" placeholder="mongodb+srv://hub_app:••••@cluster0.xxxxx.mongodb.net/hub"></div>`}
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" id="mt">${ic('bolt')}Test connection</button><span id="mr" class="muted"></span></div></div>
  <div class="card panel"><h3>What gets stored</h3>
   <div class="tablewrap"><table style="min-width:0"><thead><tr><th>Collection</th><th>Holds</th></tr></thead><tbody>
    <tr><td class="mono">users</td><td>Name, email, role, permissions, password hash</td></tr>
    <tr><td class="mono">sessions</td><td>One row per sign-in, expires on its own</td></tr>
    <tr><td class="mono">audit</td><td>Time, person, action, area, detail, IP</td></tr>
    <tr><td class="mono">options</td><td>Custom hub options and their curl</td></tr></tbody></table></div>
   <div class="muted" style="font-size:13px">The browser never talks to MongoDB. A small API in front of it handles sign in, permissions and logging.</div></div>
 </div>`;
 $$('[data-test]',v).forEach(b=>b.onclick=async()=>{const k=b.dataset.test,out=$('[data-tres="'+k+'"]',v);b.disabled=true;out.textContent='Testing…';
  try{const r=await api('POST','/api/admin/connections/'+encodeURIComponent(k)+'/test');out.innerHTML=r.ok?`<span style="color:var(--good,#1a7f37);font-weight:600">${esc(r.message)}</span>`:`<span style="color:var(--bad,#b42318);font-weight:600">${esc(r.error)}</span>`}catch(e){out.textContent=e.message}
  b.disabled=false});
 wireGpl(v);
 $$('[data-sup]',v).forEach(b=>b.onclick=()=>{supEditor(b.dataset.sup,$('#supBox'),()=>renderView());$('#supBox').scrollIntoView({behavior:'smooth',block:'nearest'})});
 $$('[data-curl]',v).forEach(b=>b.onclick=()=>{const m=MODULES.find(x=>x.id===b.dataset.curl);
  $('#curlBox').innerHTML=`<div class="card panel"><h3>${esc(m.name)} · curl</h3><div class="field"><label for="cu">Paste curl command</label><textarea class="inp mono" id="cu" rows="5" placeholder="curl 'https://superset.example.com/api/v1/chart/data' -H 'Authorization: Bearer …'"></textarea></div>
  <div style="display:flex;gap:8px"><button class="btn" id="cs">Save</button><button class="btn ghost" id="cx">Cancel</button></div></div>`;
  $('#curlBox').scrollIntoView({behavior:'smooth',block:'nearest'});
  $('#cx').onclick=()=>$('#curlBox').innerHTML='';
  $('#cs').onclick=()=>{const c=$('#cu').value.trim();if(!/^curl\s/i.test(c))return toast('That does not look like a curl command.');m.curl=c;log('setting','admin','Saved curl for '+m.name);toast('Curl saved (demo, kept in this tab only)');renderView()};
 });
 $('#mt').onclick=LIVE?async()=>{$('#mr').textContent='Checking…';try{const h=await api('GET','/api/admin/health');$('#mr').textContent=(h.store==='mongo'?'MongoDB connected.':'Using the in-memory store (data is lost on restart). Set MONGODB_URI.')}catch(e){$('#mr').textContent=e.message}}:()=>{const ok=/^mongodb(\+srv)?:\/\//.test($('#mg').value.trim());$('#mr').textContent=ok?'Looks valid. A live test runs once the API exists.':'Enter a mongodb:// or mongodb+srv:// string.'};
};

/* ----- Hub Options (admin builds new modules from a Superset curl) ----- */
function curlEndpoint(c){const m=(c||'').match(/https?:\/\/[^\s'"]+/);if(!m)return 'Endpoint not detected';try{const u=new URL(m[0]);return u.host+u.pathname}catch(e){return m[0].slice(0,60)}}
VIEWS.options=v=>{
 const custom=MODULES.filter(m=>m.custom);
 v.innerHTML=`<div class="page-h"><div><h2>Hub Options</h2><p>Add a new tool to the hub from a Superset dashboard curl. It appears in the sidebar and on the home screen for the roles you pick, and gets its own permission column.</p></div></div>
 <form class="card panel" id="of"><h3>New option</h3>
  <div class="toolbar">
   <div class="field" style="flex:2 1 240px"><label for="on">Name</label><input class="inp" id="on" required placeholder="e.g. Agent float balances"></div>
   </div>
  <div class="field"><label>Icon</label><div class="picker">${['dashboard','analytics','payments','account_balance','credit_card','storefront','local_shipping','support_agent','qr_code_2','shield','fact_check','trending_up','badge','inventory_2','phone_iphone','lightbulb'].map((n,i)=>`<label title="${n}"><input type="radio" name="oi" value="${n}" ${i===0?'checked':''}><span class="pk">${ic(n)}</span></label>`).join('')}</div></div>
  <div class="field"><label for="od">Description</label><input class="inp" id="od" placeholder="What people use this for"></div>
  <div class="field"><label for="ofl">Search fields (comma separated)</label><input class="inp" id="ofl" placeholder="Account number, Date range" value="Account number"></div>
  <div class="field"><label for="oc">Superset dashboard curl</label><textarea class="inp mono" id="oc" rows="5" placeholder="curl 'https://superset.example.com/api/v1/dashboard/12/charts' -H 'Authorization: Bearer …'"></textarea>
   <span class="muted" style="font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:400">Leave empty to add the curl later. Once a backend exists, tokens in the curl are kept on the server and never shown in the browser. Only the endpoint is displayed here.</span></div>
  <div class="field"><label>Who gets access</label><div class="demo-users">${['Admin','Supervisor','Agent'].map(r=>`<label class="chip" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" class="orole" value="${r}" ${r==='Admin'?'checked disabled':''}> ${r}</label>`).join('')}</div></div>
  <div class="err" id="oerr"></div>
  <div><button class="btn" type="submit">Create option</button></div></form>
 <div class="card panel"><h3>Your custom options</h3>
  ${custom.length?`<div class="tablewrap"><table><thead><tr><th>Option</th><th>Fields</th><th>Superset endpoint</th><th></th></tr></thead><tbody>${custom.map(m=>`<tr><td><b>${esc(m.name)}</b><div class="muted" style="font-size:12.5px">${esc(m.desc)}</div></td><td>${m.fields.map(f=>`<span class="pill neutral">${esc(f)}</span>`).join(' ')}</td><td class="mono">${m.curl?esc(curlEndpoint(m.curl)):'<span class="pill warn">Awaiting curl</span>'}</td>
   <td class="r"><button class="btn ghost sm" data-open="${m.id}">Open</button> <button class="btn ghost sm" data-ec="${m.id}">${m.curl?'Replace curl':'Add curl'}</button> <button class="btn danger sm" data-del="${m.id}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Nothing here yet. Options you create will be listed here.</div>'}
  <div id="ebox"></div></div>`;
 $('#of').onsubmit=async e=>{
  e.preventDefault();
  const name=$('#on').value.trim(),curl=$('#oc').value.trim();
  if(MODULES.some(m=>m.name.toLowerCase()===name.toLowerCase()))return $('#oerr').textContent='An option with that name already exists.';
  if(curl&&!/^curl\s/i.test(curl))return $('#oerr').textContent='That does not look like a curl command. It should start with "curl".';
  const roles=['Admin',...$$('.orole:checked').map(x=>x.value)];
  if(LIVE){
   const fields=$('#ofl').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5);
   try{await api('POST','/api/admin/options',{name,ico:($('input[name=oi]:checked')||{value:'dashboard'}).value,desc:$('#od').value.trim(),fields:fields.length?fields:['Search'],curl,roles});toast('Created "'+name+'"');await liveStart();S.route='options';renderShell()}catch(x){$('#oerr').textContent=x.message}
   return;
  }
  const m={id:'c_'+Date.now(),name,ico:($('input[name=oi]:checked')||{value:'dashboard'}).value,desc:$('#od').value.trim()||'Custom Superset dashboard.',custom:true,curl,
   fields:$('#ofl').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5)};
  if(!m.fields.length)m.fields=['Search'];
  MODULES.push(m);SRC[m.id]='Superset · custom dashboard';
  roles.forEach(r=>{const add=r==='Agent'?[m.id]:[m.id,EXP(m.id)];DEFAULT_PERMS[r].push(...add);USERS.filter(u=>u.role===r).forEach(u=>u.perms.push(...add))});
  log('create','admin','Created option "'+name+'" for '+roles.join(', '));toast('Created "'+name+'"');renderShell();
 };
 $$('[data-open]',v).forEach(b=>b.onclick=()=>go(b.dataset.open));
 $$('[data-del]',v).forEach(b=>b.onclick=()=>{const m=MODULES.find(x=>x.id===b.dataset.del);
  $('#ebox').innerHTML=`<div class="diag"><b>Remove "${esc(m.name)}"?</b><span>It disappears for everyone and its permission column is deleted.</span><div style="display:flex;gap:8px;margin-top:6px"><button class="btn danger sm" id="dy">Remove</button><button class="btn ghost sm" id="dn">Keep</button></div></div>`;
  $('#dn').onclick=()=>$('#ebox').innerHTML='';
  $('#dy').onclick=async()=>{if(LIVE){try{await api('DELETE','/api/admin/options/'+encodeURIComponent(m.id));await liveStart();S.route='options';renderShell()}catch(e){toast(e.message)}return}
   MODULES.splice(MODULES.indexOf(m),1);const gone=p=>p!==m.id&&p!==EXP(m.id);USERS.forEach(u=>u.perms=u.perms.filter(gone));Object.keys(DEFAULT_PERMS).forEach(k=>DEFAULT_PERMS[k]=DEFAULT_PERMS[k].filter(gone));log('delete','admin','Removed option "'+m.name+'"');renderShell()}});
 $$('[data-ec]',v).forEach(b=>b.onclick=()=>{const m=MODULES.find(x=>x.id===b.dataset.ec);
  $('#ebox').innerHTML=`<div class="field"><label for="ecu">New curl for ${esc(m.name)}</label><textarea class="inp mono" id="ecu" rows="4"></textarea></div><div style="display:flex;gap:8px"><button class="btn" id="es">Save curl</button><button class="btn ghost" id="ex">Cancel</button></div>`;
  $('#ex').onclick=()=>$('#ebox').innerHTML='';
  $('#es').onclick=async()=>{const c=$('#ecu').value.trim();if(!/^curl\s/i.test(c))return toast('That does not look like a curl command.');
   if(LIVE){try{await api('PUT','/api/admin/options/'+encodeURIComponent(m.id),{curl:c});toast('Curl saved.')}catch(e){return toast(e.message)}return renderView()}
   m.curl=c;log('setting','admin','Updated curl for '+m.name);renderView()}});
};

function customView(v){
 const m=MODULES.find(x=>x.id===S.route),f=S.filters[m.id]||(S.filters[m.id]={});
 v.innerHTML=head(m.name,m.desc,m.id)+`
 <form class="card panel" id="cf"><div class="toolbar">${m.fields.map((x,i)=>`<div class="field"><label for="cf${i}">${esc(x)}</label><input class="inp" id="cf${i}" value="${esc(f[x]||'')}"></div>`).join('')}<button class="btn" type="submit">Run</button></div></form>
 <div id="cr"></div>`;
 const run=(logIt)=>{
  const vals=m.fields.map((x,i)=>$('#cf'+i).value.trim());m.fields.forEach((x,i)=>f[x]=vals[i]);
  if(logIt)log('search',m.id,m.fields.map((x,i)=>x+': "'+vals[i]+'"').join(', '));
  const s=hash(vals.join('|')||m.id);
  const rows=Array.from({length:5},(_,i)=>{const k=hash(s+'r'+i);return [...m.fields.map((x,j)=>vals[j]||('Sample '+(100+k%900))),money(k%900),pick(['Success','Pending','Failed'],k>>3)]});
  $('#cr').innerHTML=`<div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>Result</h3>${m.curl?`<span class="pill good"><span class="dot"></span>Curl saved · <span class="mono">${esc(curlEndpoint(m.curl))}</span></span>`:'<span class="pill warn"><span class="dot"></span>Awaiting curl</span>'}</div>
  <div style="border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)">The Superset dashboard response will be shown here once the format is added. Sample rows are below.</div>
  <div class="tablewrap"><table><thead><tr>${m.fields.map(x=>`<th>${esc(x)}</th>`).join('')}<th class="r">Value</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.slice(0,-2).map(c=>`<td>${esc(c)}</td>`).join('')}<td class="r num">${r[r.length-2]}</td><td>${pill(r[r.length-1])}</td></tr>`).join('')}</tbody></table></div><div style="display:flex;justify-content:flex-end">${exportBtn(m.id)}</div></div>`;wireExport($('#cr'),m.id);
 };
 $('#cf').onsubmit=e=>{e.preventDefault();run(true)};run(false);
}

/* ========== command palette ========== */
function openCmd(){
 const items=q=>{
  const base=[...MODULES.filter(m=>can(m.id)).map(m=>({l:'Open '+m.name,a:()=>go(m.id)})),...(can('admin')?ADMIN.map(a=>({l:'Open '+a.name,a:()=>go(a.id)})):[])];
  const f=base.filter(i=>i.l.toLowerCase().includes(q.toLowerCase()));
  if(q&&can('search'))f.unshift({l:`Search customers for "${q}"`,a:()=>{S.tab.search=/^\d+$/.test(q)?'id':'name';S.sel.searchQ=q;go('search')}});
  return f;
 };
 $('#overlay').innerHTML=`<div class="cmd-bg" id="cb"><div class="card cmd"><input id="ci" placeholder="Type a module name, or a name or ID to search" autocomplete="off"><ul id="cl"></ul></div></div>`;
 const draw=()=>{const l=items($('#ci').value);$('#cl').innerHTML=l.map((i,n)=>`<li data-n="${n}" class="${n===0?'sel':''}">${esc(i.l)}</li>`).join('')||'<li class="muted">No matches</li>';
  $$('#cl li[data-n]').forEach(li=>li.onclick=()=>{const it=l[+li.dataset.n];close();it.a()});window._cmd=l};
 const close=()=>$('#overlay').innerHTML='';
 $('#ci').oninput=draw;$('#ci').focus();draw();
 $('#cb').onclick=e=>{if(e.target.id==='cb')close()};
 $('#ci').onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&window._cmd[0]){const it=window._cmd[0];close();it.a()}};
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.user){e.preventDefault();openCmd()}});

/* ========== boot ========== */
LIVE?liveBoot():renderLogin();
</script>
