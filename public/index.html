let SUPAUTH={};
const authPill=c=>{if(!LIVE)return '';const a=(SUPAUTH[c.env]||{});return a.saved?`<span class="pill good"><span class="dot"></span>${c.env.toUpperCase()} login saved</span>`:`<span class="pill warn"><span class="dot"></span>No ${c.env.toUpperCase()} login. Paste a curl</span>`};
function supCards(){
 return Object.entries(SUP).map(([k,c])=>`<div class="card srccard"><div style="display:flex;gap:12px;align-items:center"><span class="pi">${ic('receipt_long')}</span><div style="min-width:0"><b>${esc(c.label)}</b><div class="muted" style="font-size:13px">${esc(c.desc)}</div></div></div>
  <div class="mono muted" style="overflow-wrap:anywhere;font-size:12px">${supUrl(c)?esc(supUrl(c)):'No URL yet'}</div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${c.env==='prod'?'accent':'info'}">${c.env.toUpperCase()}</span><span class="pill neutral">${Number(c.timeoutSec)||60}s timeout</span>${supUrl(c)?'<span class="pill good"><span class="dot"></span>Ready</span>':'<span class="pill warn"><span class="dot"></span>No URL</span>'}${authPill(c)}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${LIVE?`<button class="btn ghost sm" data-test="${k}">${ic('bolt')}Test</button>`:''}<button class="btn ghost sm" data-sup="${k}">${ic('edit')}Edit connection</button></span></div><div class="muted" style="font-size:13px" data-tres="${k}"></div></div>`).join('');
}
function supEditor(key,box,onSaved){
 const orig=SUP[key],d=JSON.parse(JSON.stringify(orig));let tab=d.env,msg='';
 const F=[['base','Base URL','http://superset.example.com:8091',2],['datasource','Dataset ID','74',1],['slice','Chart ID','76',1],['dashboard','Dashboard ID','99',1],['rowLimit','Row limit','1000',1]];
 const val=id=>{const el=$('#'+id,box);return el?el.value.trim():null};
 const collect=()=>{
  const e=d.envs[tab];F.forEach(([k])=>{const x=val('sf_'+k);if(x!==null)e[k]=x});
  if(val('sf_endpoint')!==null){d.endpoint=val('sf_endpoint');d.searchCols=val('sf_sc').split(',').map(x=>x.trim()).filter(Boolean);d.dateCol=val('sf_dc');d.minChars=Math.max(1,Number(val('sf_mc'))||1);d.timeoutSec=Math.max(5,Math.min(600,Number(val('sf_to'))||60));d.columns=val('sf_cols').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
   const ok=[],bad=[];val('sf_fx').split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{const m=l.match(/^(\S+)\s+(IS NOT NULL|IS NULL)$/i);m?ok.push({col:m[1],op:m[2].toUpperCase()}):bad.push(l)});d.fixedFilters=ok;d._bad=bad}
 };
 const draw=()=>{
  const e=d.envs[tab];
  let prev='';try{prev=JSON.stringify(buildBody({...d,env:tab},['{value}'],'No filter'),null,2)}catch(x){prev='Could not build a preview.'}
  box.innerHTML=`<div class="card panel" style="margin-top:6px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3>Edit: ${esc(d.label)}</h3><button class="btn ghost sm" id="se_x">Close</button></div>
  <div class="field"><label>The hub uses</label><div class="tabs">${['uat','prod'].map(t=>`<button type="button" data-use="${t}" class="${d.env===t?'on':''}">${t.toUpperCase()}${d.env===t?' (live)':''}</button>`).join('')}</div></div>
  <div class="field"><label>Edit settings for</label><div class="tabs">${['uat','prod'].map(t=>`<button type="button" data-et="${t}" class="${tab===t?'on':''}">${t.toUpperCase()}</button>`).join('')}</div></div>
  <div class="toolbar">${F.map(([k,l,p,w])=>`<div class="field" style="flex:${w} 1 ${w>1?'300px':'130px'}"><label for="sf_${k}">${l}</label><input class="inp ${k==='base'?'mono':''}" id="sf_${k}" value="${esc(e[k])}" placeholder="${p}"></div>`).join('')}</div>
  ${tab==='prod'?'<div><button class="btn ghost sm" type="button" id="se_copy">Copy IDs and limit from UAT</button> <span class="muted" style="font-size:13px">Leaves the Prod URL as it is.</span></div>':''}
  <div class="pgh" style="padding-top:6px"><h3>Same for UAT and Prod</h3></div>
  <div class="toolbar"><div class="field" style="flex:2 1 260px"><label for="sf_endpoint">API path</label><input class="inp mono" id="sf_endpoint" value="${esc(d.endpoint)}"></div>
   <div class="field" style="flex:1 1 200px"><label for="sf_sc">Search columns</label><input class="inp mono" id="sf_sc" value="${esc(d.searchCols.join(', '))}"></div>
   <div class="field" style="flex:1 1 160px"><label for="sf_dc">Date column</label><input class="inp mono" id="sf_dc" value="${esc(d.dateCol)}"></div>
   <div class="field" style="flex:0 1 110px"><label for="sf_mc">Min characters</label><input class="inp" id="sf_mc" type="number" min="1" value="${d.minChars}"></div>
   <div class="field" style="flex:0 1 130px"><label for="sf_to">Timeout (seconds)</label><input class="inp" id="sf_to" type="number" min="5" max="600" value="${Number(d.timeoutSec)||60}"></div></div>
  <div class="field"><label for="sf_fx">Always-applied filters (one per line, for example Account_type IS NOT NULL)</label><textarea class="inp mono" id="sf_fx" rows="2" placeholder="Account_type IS NOT NULL">${esc((d.fixedFilters||[]).map(f=>f.col+' '+f.op).join('\n'))}</textarea></div>
  <div class="field"><label for="sf_cols">Columns returned (comma separated)</label><textarea class="inp mono" id="sf_cols" rows="3">${esc(d.columns.join(', '))}</textarea></div>
  <div class="field"><label for="sf_curl">Or paste a curl to fill these in</label><textarea class="inp mono" id="sf_curl" rows="3" placeholder="curl --location 'http://…/api/v1/chart/data' --data '{…}'"></textarea>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn ghost sm" type="button" id="se_fill">${ic('auto_fix_high')}Fill from curl</button><span class="muted" style="font-size:13px">Fills the ${tab.toUpperCase()} settings.${LIVE?' The login in the curl (cookie, token) is also saved on the server, encrypted.':' Any cookie or token in the curl is ignored.'}</span></div></div>
  <details><summary style="cursor:pointer;font-weight:600">Preview the request that will be sent</summary><div class="code" style="margin-top:8px">POST ${esc(e.base?e.base.replace(/\/+$/,'')+d.endpoint:'(no base URL yet)')}
Content-Type: application/json
Authorization: added on the server
Timeout: ${Number(d.timeoutSec)||60} seconds

${esc(prev)}</div></details>
  <div class="err" id="se_err">${esc(msg)}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="button" id="se_save">${ic('save')}Save connection</button><button class="btn ghost" type="button" id="se_cancel">Cancel</button></div>
  <div class="muted" style="font-size:13px">${LIVE?'Pasting a curl also saves its login (cookie, token) on the server, encrypted. It is never shown again. When Superset says the login expired, paste a fresh curl here.':'Cookies and tokens are never kept in this page. In the full project the server stores them encrypted.'}</div></div>`;
  $('#se_x',box).onclick=$('#se_cancel',box).onclick=()=>box.innerHTML='';
  $$('[data-et]',box).forEach(b=>b.onclick=()=>{collect();tab=b.dataset.et;msg='';draw()});
  $$('[data-use]',box).forEach(b=>b.onclick=()=>{collect();d.env=b.dataset.use;msg='';draw()});
  const cp=$('#se_copy',box);if(cp)cp.onclick=()=>{collect();const u=d.envs.uat;Object.assign(d.envs.prod,{datasource:u.datasource,slice:u.slice,dashboard:u.dashboard,rowLimit:u.rowLimit});draw()};
  $('#se_fill',box).onclick=async()=>{collect();const raw=$('#sf_curl',box).value;const r=parseCurl(raw);
   if(r.error){msg=r.error;draw();return}
   let saved='';if(LIVE){try{const ra=await api('PUT','/api/admin/superset-auth/'+tab,{curl:raw});saved=' The login in it was saved (encrypted) for '+tab.toUpperCase()+'.';SUPAUTH=(ra&&ra.auth)||SUPAUTH}catch(e){saved=' The login was not saved: '+e.message}}
   Object.assign(d.envs[tab],{base:r.base,datasource:r.datasource??'',slice:r.slice??'',dashboard:r.dashboard??'',rowLimit:r.rowLimit||1000});
   d.endpoint=r.endpoint||d.endpoint;if(r.columns.length)d.columns=r.columns;if(r.searchCols.length)d.searchCols=r.searchCols;d.dateCol=r.dateCol;d.orderBy=r.orderBy;d.fixedFilters=r.fixedFilters;msg='';draw();toast(LIVE?('Filled from curl.'+saved):'Filled from curl. The cookie was ignored.')};
  $('#se_save',box).onclick=async()=>{collect();
   for(const t of ['uat','prod']){const b=d.envs[t].base;if(b&&!/^https?:\/\/[^\s/]+/i.test(b)){tab=t;msg=t.toUpperCase()+' base URL must start with http:// or https://';draw();return}}
   if(!d.envs[d.env].base){msg='Add the '+d.env.toUpperCase()+' base URL before making it the live one.';draw();return}
   if(!d.searchCols.length){msg='Add at least one search column.';draw();return}
   if(d._bad&&d._bad.length){msg='Always-applied filters can only be "COLUMN IS NOT NULL" or "COLUMN IS NULL". Fix: '+d._bad.join(', ');draw();return}
   delete d._bad;
   if(LIVE){try{const saved=await api('PUT','/api/admin/connections/'+encodeURIComponent(key),d);Object.assign(orig,saved||d)}catch(e){msg=e.message||'Could not save.';draw();return}}
   const was=orig.env,wasT=orig.timeoutSec;if(!LIVE)Object.assign(orig,d);
   log('setting','admin',`Updated Superset connection "${orig.label}" (hub uses ${orig.env.toUpperCase()}${was!==orig.env?', was '+was.toUpperCase():''}, timeout ${orig.timeoutSec}s${wasT!==orig.timeoutSec?', was '+wasT+'s':''})`);
   toast('Connection saved. The hub now uses '+orig.env.toUpperCase()+'.');box.innerHTML='';onSaved();};
 };
 draw();
}
</script>
<script>
/* ----- Users & Permissions ----- */
function dropUser(uid){S.open.filter(o=>o.user.id===uid).forEach(closeEntry);SESSIONS=SESSIONS.filter(s=>s.uid!==uid)}
const pcols=()=>[...MODULES.map(m=>[m.id,({search:'Search',fees:'Fees',txns:'History',limits:'Limits',giftcards:'Giftcards',gpl:'GPL'}[m.id]||m.name)]),...SPECIAL.map(s=>[s.id,{dl_images:'Images',unmask:'Unmask',export:'Export'}[s.id]]),['admin','Admin']];
VIEWS.users=v=>{
 const sel=USERS.find(u=>u.id===S.sel.permUser)||USERS[0];S.sel.permUser=sel.id;
 const q=(S.filters.pq||'').toLowerCase();
 const list=USERS.filter(u=>!q||(u.name+u.email).toLowerCase().includes(q));
 const has=k=>sel.perms.includes(k);
 const seg=(key,dis)=>{const on=has(key);return `<div class="seg" role="group" aria-label="${esc(key)}"><button class="yes ${on?'on':''}" data-set="${esc(key)}" data-val="1" aria-pressed="${on}" ${dis?'disabled':''}>${ic('check')}Allowed</button><button class="no ${on?'':'on'}" data-set="${esc(key)}" data-val="0" aria-pressed="${!on}" ${dis?'disabled':''}>${ic('block')}Blocked</button></div>`};
 const label=k=>k==='admin'?'Admin access':k.startsWith('export:')?'Export · '+(MODULES.find(m=>m.id===k.slice(7))||{name:k}).name:([...MODULES,...SPECIAL].find(x=>x.id===k)||{name:k}).name;
 const nMods=u=>u.perms.filter(p=>MODULES.some(m=>m.id===p)).length;
 const sess=SESSIONS.filter(x=>x.uid===sel.id).length;
 v.innerHTML=`<div class="page-h"><div><h2>Users & Permissions</h2><p>Pick a person, then set what they can open and what they can export or download. Changes apply on their next page load and are written to the audit log.</p></div>
  <button class="btn" id="addU">${ic('person_add')}Add user</button></div>
 ${S.sel.tempPw?`<div class="diag" style="background:var(--warn-soft)"><b style="color:var(--warn)">Temporary password for ${esc(S.sel.tempPw.name)}</b><span>Copy it now. It is shown once. They must change it when they sign in.</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px"><span class="mono" style="font-size:15px;font-weight:600">${esc(S.sel.tempPw.pw)}</span><button class="btn ghost sm" id="cpw">Copy</button><button class="btn ghost sm" id="dpw">Done</button></div></div>`:''}
 <div id="addForm"></div>
 <div class="permgrid">
  <aside class="card plist">
   <input class="inp" id="pq" placeholder="Search people" value="${esc(S.filters.pq||'')}" aria-label="Search people">
   ${list.map(u=>`<button class="pitem ${u.id===sel.id?'on':''}" data-pick="${u.id}"><span class="avatar">${esc(initials(u.name))}</span><span class="meta"><b>${esc(u.name)}</b><span class="muted" style="font-size:12.5px">${esc(u.role)} · ${nMods(u)}/${MODULES.length} modules</span></span>${u.status==='active'?'':'<span class="pill bad">Off</span>'}</button>`).join('')||'<div class="muted" style="padding:12px">No one matches.</div>'}
  </aside>
  <section class="card panel" style="padding:22px">
   <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <span class="avatar" style="width:52px;height:52px;font-size:17px">${esc(initials(sel.name))}</span>
    <div style="flex:1 1 200px;min-width:0"><h3 style="font-size:22px">${esc(sel.name)}</h3><div class="muted">${esc(sel.email)} · ${sel.status==='active'?'Active':'Disabled'} · ${sess} open session${sess===1?'':'s'}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-tog="${sel.id}">${ic(sel.status==='active'?'person_off':'person')}${sel.status==='active'?'Disable':'Enable'}</button>${LIVE?`<button class="btn ghost sm" data-rpw="${sel.id}">${ic('lock_reset')}Reset password</button>`:''}<button class="btn ghost sm" data-rm="${sel.id}">${ic('delete')}Remove</button></div>
   </div>
   <div class="toolbar" style="margin-top:6px"><div class="field" style="max-width:220px"><label for="rr">Start from a role</label><select class="inp" id="rr">${Object.keys(DEFAULT_PERMS).map(r=>`<option ${r===sel.role?'selected':''}>${r}</option>`).join('')}</select></div><button class="btn ghost" id="rb">Apply role</button></div>

   <div class="pgh"><h3>Modules</h3><div style="display:flex;gap:6px"><button class="btn ghost sm" data-grp="mods" data-val="1">Allow all</button><button class="btn ghost sm" data-grp="mods" data-val="0">Block all</button></div></div>
   ${MODULES.map(m=>`<div class="prow"><span class="pi">${ic(m.ico)}</span><div class="pt"><b>${esc(m.name)}</b><span class="muted" style="font-size:13px">${esc(m.desc)}</span></div>
    <div class="pctl"><div class="pc"><small>Open</small>${seg(m.id)}</div><div class="pc"><small>Export CSV</small>${seg(EXP(m.id),!has(m.id))}</div></div></div>`).join('')}

   <div class="pgh"><h3>Downloads and sensitive data</h3><div style="display:flex;gap:6px"><button class="btn ghost sm" data-grp="act" data-val="1">Allow all</button><button class="btn ghost sm" data-grp="act" data-val="0">Block all</button></div></div>
   ${SPECIAL.map(x=>`<div class="prow"><span class="pi">${ic(x.ico)}</span><div class="pt"><b>${esc(x.name)}</b><span class="muted" style="font-size:13px">${esc(x.desc)}</span></div><div class="pctl"><div class="pc"><small>Permission</small>${seg(x.id)}</div></div></div>`).join('')}

   <div class="pgh"><h3>Administration</h3></div>
   <div class="prow"><span class="pi">${ic('admin_panel_settings')}</span><div class="pt"><b>Admin access</b><span class="muted" style="font-size:13px">Manage users, hub options, sessions, audit log and data sources.</span></div><div class="pctl"><div class="pc"><small>Permission</small>${seg('admin')}</div></div></div>
  </section></div>`;

 const sync=async u=>{if(!LIVE)return;try{await api('PUT','/api/admin/users/'+encodeURIComponent(u.id),{role:u.role,perms:u.perms,status:u.status})}catch(e){toast(e.message||'Could not save the change.')}};
 const setPerm=(u,k,on)=>{
  if(u.id===S.user.id&&k==='admin'&&!on)return toast('You cannot remove your own admin access.');
  const had=u.perms.includes(k);if(had===on)return;
  u.perms=on?[...u.perms,k]:u.perms.filter(x=>x!==k);
  if(!on&&MODULES.some(m=>m.id===k))u.perms=u.perms.filter(x=>x!==EXP(k));
  log(on?'grant':'revoke','admin',`${on?'Granted':'Revoked'} "${label(k)}" ${on?'to':'from'} ${u.name}`);
 };
 $$('[data-set]',v).forEach(b=>b.onclick=async()=>{setPerm(sel,b.dataset.set,b.dataset.val==='1');toast(`${b.dataset.val==='1'?'Allowed':'Blocked'}: ${label(b.dataset.set)} for ${sel.name.split(' ')[0]}`);await sync(sel);renderView()});
 $$('[data-grp]',v).forEach(b=>b.onclick=async()=>{const on=b.dataset.val==='1';
  const keys=b.dataset.grp==='mods'?[...MODULES.map(m=>m.id),...MODULES.map(m=>EXP(m.id))]:SPECIAL.map(x=>x.id);
  keys.forEach(k=>setPerm(sel,k,on));await sync(sel);renderView()});
 $$('[data-pick]',v).forEach(b=>b.onclick=()=>{S.sel.permUser=b.dataset.pick;drawView()});
 $('#pq').oninput=e=>{S.filters.pq=e.target.value;drawView();const el=$('#pq');el.focus();el.setSelectionRange(el.value.length,el.value.length)};
 $$('[data-tog]',v).forEach(b=>b.onclick=async()=>{const u=USERS.find(x=>x.id===b.dataset.tog);
  if(u.id===S.user.id)return toast('You cannot disable your own account.');
  u.status=u.status==='active'?'disabled':'active';
  if(u.status==='disabled')dropUser(u.id);
  log('account','admin',`${u.status==='active'?'Enabled':'Disabled'} ${u.name}`);await sync(u);renderView()});
 $$('[data-rm]',v).forEach(b=>b.onclick=async()=>{const u=USERS.find(x=>x.id===b.dataset.rm);
  if(u.id===S.user.id)return toast('You cannot remove yourself.');
  if(LIVE){try{await api('DELETE','/api/admin/users/'+encodeURIComponent(u.id))}catch(e){return toast(e.message||'Could not remove the user.')}}
  USERS=USERS.filter(x=>x.id!==u.id);dropUser(u.id);S.sel.permUser=null;log('account','admin','Removed '+u.name);renderView()});
 const cpw=$('#cpw');if(cpw){cpw.onclick=()=>{try{navigator.clipboard.writeText(S.sel.tempPw.pw).then(()=>toast('Copied'),()=>toast('Select and copy the password.'))}catch(e){toast('Select and copy the password.')}};$('#dpw').onclick=()=>{S.sel.tempPw=null;drawView()}}
 $$('[data-rpw]',v).forEach(b=>b.onclick=async()=>{try{const d=await api('POST','/api/admin/users/'+encodeURIComponent(b.dataset.rpw)+'/reset-password');S.sel.tempPw={name:sel.name,pw:d.tempPassword};drawView()}catch(e){toast(e.message||'Could not reset the password.')}});
 $('#rb').onclick=async()=>{const r=$('#rr').value;
  if(sel.id===S.user.id&&r!=='Admin')return toast('You cannot lower your own role.');
  if(LIVE){try{await api('PUT','/api/admin/users/'+encodeURIComponent(sel.id),{role:r,applyRoleDefaults:true})}catch(e){return toast(e.message||'Could not change the role.')}return renderView()}
  sel.role=r;sel.perms=[...DEFAULT_PERMS[r]];log('role','admin',`Set ${sel.name} to ${r}`);renderView()};
 $('#addU').onclick=()=>{
  $('#addForm').innerHTML=`<form class="card panel" id="nu"><h3>New user</h3><div class="toolbar">
   <div class="field"><label for="nn">Full name</label><input class="inp" id="nn" required></div>
   <div class="field"><label for="ne">Email</label><input class="inp" id="ne" type="email" required></div>
   <div class="field"><label for="nr">Role</label><select class="inp" id="nr"><option>Agent</option><option>Supervisor</option><option>Admin</option></select></div>
   <button class="btn" type="submit">Create</button><button class="btn ghost" type="button" id="nc">Cancel</button></div>
   <div class="muted" style="font-size:13px">${LIVE?'You will get a temporary password to give them. They must choose their own when they first sign in.':'They get a one-time link to set their own password. You can then fine-tune what they can do.'}</div></form>`;
  $('#nc').onclick=()=>$('#addForm').innerHTML='';
  $('#nu').onsubmit=async e=>{e.preventDefault();const r=$('#nr').value,id='u'+Date.now();
   if(LIVE){try{const d=await api('POST','/api/admin/users',{name:$('#nn').value.trim(),email:$('#ne').value.trim(),role:r});S.sel.permUser=d.user.id;S.sel.tempPw={name:d.user.name,pw:d.tempPassword}}catch(x){return toast(x.message||'Could not create the user.')}return renderView()}
   USERS.push({id,name:$('#nn').value.trim(),email:$('#ne').value.trim(),role:r,perms:[...DEFAULT_PERMS[r]],status:'active',mfa:false,last:'Never'});
   S.sel.permUser=id;log('account','admin','Created user '+$('#nn').value.trim()+' as '+r);renderView()};
 };
};

/* ----- Audit Log ----- */
VIEWS.audit=v=>{
 const f=S.filters.audit||(S.filters.audit={uid:'All',mod:'All',q:''});
 const mods=['All',...new Set(AUDIT.map(a=>a.mod))];
 v.innerHTML=`<div class="page-h"><div><h2>Audit Log</h2><p>Who signed in, what they opened and what they searched, with the exact values used. ${LIVE?'Stored in MongoDB.':'Stored in MongoDB once the cluster is connected.'}</p></div><button class="btn ghost sm" id="ax">Export CSV</button></div>
 <div class="card panel"><div class="toolbar">
  <div class="field"><label for="au">Person</label><select class="inp" id="au"><option value="All">All</option>${USERS.map(u=>`<option value="${u.id}" ${f.uid===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
  <div class="field"><label for="am">Area</label><select class="inp" id="am">${mods.map(m=>`<option ${f.mod===m?'selected':''}>${m}</option>`).join('')}</select></div>
  <div class="field"><label for="aq">Contains</label><input class="inp" id="aq" value="${esc(f.q)}" placeholder="e.g. TXN-88213"></div></div></div>
 <div id="ares"></div>`;
 const draw=()=>{
  const rows=AUDIT.filter(a=>(f.uid==='All'||a.uid===f.uid)&&(f.mod==='All'||a.mod===f.mod)&&(!f.q||(a.detail+a.act).toLowerCase().includes(f.q.toLowerCase())));
  const tone=a=>({login:'good',logout:'neutral',grant:'accent',revoke:'warn',download:'warn',export:'warn',account:'accent',role:'accent'}[a]||'neutral');
  $('#ares').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Time</th><th>Person</th><th>Action</th><th>Area</th><th>Detail</th></tr></thead><tbody>
  ${rows.map(a=>`<tr><td class="mono">${a.t}</td><td>${esc(a.un||uname(a.uid))}</td><td><span class="pill ${tone(a.act)}">${esc(a.act)}</span></td><td>${esc(a.mod)}</td><td>${esc(a.detail)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No events match.</div>';
 };
 $('#au').onchange=e=>{f.uid=e.target.value;draw()};$('#am').onchange=e=>{f.mod=e.target.value;draw()};
 $('#aq').oninput=e=>{f.q=e.target.value;draw()};
 $('#ax').onclick=()=>{const rows=AUDIT.filter(a=>(f.uid==='All'||a.uid===f.uid)&&(f.mod==='All'||a.mod===f.mod)&&(!f.q||(a.detail+a.act).toLowerCase().includes(f.q.toLowerCase()))).map(a=>({Time:a.t,Person:a.un||uname(a.uid),Action:a.act,Area:a.mod,Detail:a.detail}));
  saveFile(`audit_log_${new Date().toISOString().slice(0,10)}.csv`,toCsv(['Time','Person','Action','Area','Detail'],rows),'audit',`Downloaded ${rows.length} audit row(s)`)};draw();
};

/* ----- Sessions ----- */
VIEWS.sessions=v=>{
 v.innerHTML=`<div class="page-h"><div><h2>Active Sessions</h2><p>Everyone signs in with their own session, so one person signing in or out never affects anyone else. End a single session to sign only that device out.</p></div></div>
 <div class="tablewrap"><table><thead><tr><th>Person</th><th>Device</th><th>IP address</th><th>Signed in</th><th>Last active</th><th></th></tr></thead><tbody>
 ${SESSIONS.map(s=>`<tr><td><b>${esc(s.uname||uname(s.uid))}</b></td><td>${esc(s.device)}</td><td class="mono">${s.ip}</td><td class="num">${s.since}</td><td>${s.seen}</td>
 <td class="r">${(s.current||s.id===S.session.id)?'<span class="pill accent">This session</span>':`<button class="btn danger sm" data-end="${s.id}">End session</button>`}</td></tr>`).join('')}</tbody></table></div>
 ${LIVE?'<div class="card panel"><h3>Session rules</h3><div class="muted">Idle timeout and maximum session length are set on the server with SESSION_IDLE_MIN and SESSION_MAX_HOURS.</div></div>':`<div class="card panel"><h3>Session rules</h3>
  ${[['Sign out after 30 minutes of no activity',true],['Require a second factor at sign in',true],['Only allow sign in from office IP ranges',false],['One active session per person',false]].map((r,i)=>`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span>${r[0]}</span><label class="switch"><input type="checkbox" data-rule="${i}" ${r[1]?'checked':''}><i></i></label></div>`).join('')}
  <div class="muted" style="font-size:12.5px">These switches are display only until the auth backend is connected.</div></div>`}`;
 $$('[data-end]',v).forEach(b=>b.onclick=async()=>{
  if(LIVE){try{await api('DELETE','/api/admin/sessions/'+encodeURIComponent(b.dataset.end));toast('Session ended.')}catch(e){toast(e.message||'Could not end the session.')}return renderView()}
  const s=SESSIONS.find(x=>x.id===b.dataset.end);const oe=S.open.find(o=>o.session===s);if(oe)closeEntry(oe);else SESSIONS=SESSIONS.filter(x=>x!==s);log('session','admin','Ended session for '+uname(s.uid));renderView()});
 $$('[data-rule]',v).forEach(i=>i.onchange=()=>log('setting','admin','Session rule '+i.dataset.rule+(i.checked?' on':' off')));
};

/* ----- Data Sources ----- */
VIEWS.sources=v=>{
 v.innerHTML=`<div class="page-h"><div><h2>Data Sources</h2><p>Every module reads from a Superset dataset. Add its curl and the sample data is replaced with live results.</p></div></div>
 <div class="pgh" style="border:0;padding-bottom:0"><h3>Report connections</h3></div>
 <div class="srcgrid">${supCards()}</div>
 <div id="supBox"></div>
 ${LIVE?'<div class="muted">Fees & Commissions, Limits, Giftcards and GPL tokens still show sample data. Their queries have not been added yet.</div>':`<div class="pgh" style="border:0;padding-bottom:0"><h3>Other modules</h3></div>
  <div class="srcgrid">${MODULES.filter(m=>!['txns','search'].includes(m.id)).map(m=>`<div class="card srccard"><div style="display:flex;gap:12px;align-items:center"><span class="pi">${ic(m.ico)}</span><div style="min-width:0"><b>${esc(m.name)}</b><div class="mono muted" style="overflow:hidden;text-overflow:ellipsis">${esc(SRC[m.id].replace('Superset · ',''))}</div></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${m.curl?'<span class="pill good"><span class="dot"></span>Curl saved</span>':'<span class="pill warn"><span class="dot"></span>Awaiting curl</span>'}<button class="btn ghost sm" data-curl="${m.id}">${ic('terminal')}${m.curl?'Replace curl':'Add curl'}</button></div></div>`).join('')}</div>
`} <div id="curlBox"></div>
 <div class="two">
  <div class="card panel"><h3>Connect MongoDB</h3>
   <ol class="steps"><li><div><b>Create a cluster</b><div class="muted" style="font-size:13px">An Atlas M0 free cluster is enough to start.</div></div></li>
    <li><div><b>Add a database user</b><div class="muted" style="font-size:13px">Give it read and write on the hub database only.</div></div></li>
    <li><div><b>Allow your server's IP</b><div class="muted" style="font-size:13px">Under Network Access in Atlas.</div></div></li>
    <li><div><b>Paste the connection string</b></div></li></ol>
   ${LIVE?'<div class="muted" style="font-size:13px">The connection string is set with MONGODB_URI on the server. It is never typed into this page.</div>':`<div class="field"><label for="mg">Connection string</label><input class="inp mono" id="mg" placeholder="mongodb+srv://hub_app:••••@cluster0.xxxxx.mongodb.net/hub"></div>`}
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn" id="mt">${ic('bolt')}Test connection</button><span id="mr" class="muted"></span></div></div>
  <div class="card panel"><h3>What gets stored</h3>
   <div class="tablewrap"><table style="min-width:0"><thead><tr><th>Collection</th><th>Holds</th></tr></thead><tbody>
    <tr><td class="mono">users</td><td>Name, email, role, permissions, password hash</td></tr>
    <tr><td class="mono">sessions</td><td>One row per sign-in, expires on its own</td></tr>
    <tr><td class="mono">audit</td><td>Time, person, action, area, detail, IP</td></tr>
    <tr><td class="mono">options</td><td>Custom hub options and their curl</td></tr></tbody></table></div>
   <div class="muted" style="font-size:13px">The browser never talks to MongoDB. A small API in front of it handles sign in, permissions and logging.</div></div>
 </div>`;
 $$('[data-test]',v).forEach(b=>b.onclick=async()=>{const k=b.dataset.test,out=$('[data-tres="'+k+'"]',v);b.disabled=true;out.textContent='Testing…';
  try{const r=await api('POST','/api/admin/connections/'+encodeURIComponent(k)+'/test');out.innerHTML=r.ok?`<span style="color:var(--good,#1a7f37);font-weight:600">${esc(r.message)}</span>`:`<span style="color:var(--bad,#b42318);font-weight:600">${esc(r.error)}</span>`}catch(e){out.textContent=e.message}
  b.disabled=false});
 $$('[data-sup]',v).forEach(b=>b.onclick=()=>{supEditor(b.dataset.sup,$('#supBox'),()=>renderView());$('#supBox').scrollIntoView({behavior:'smooth',block:'nearest'})});
 $$('[data-curl]',v).forEach(b=>b.onclick=()=>{const m=MODULES.find(x=>x.id===b.dataset.curl);
  $('#curlBox').innerHTML=`<div class="card panel"><h3>${esc(m.name)} · curl</h3><div class="field"><label for="cu">Paste curl command</label><textarea class="inp mono" id="cu" rows="5" placeholder="curl 'https://superset.example.com/api/v1/chart/data' -H 'Authorization: Bearer …'"></textarea></div>
  <div style="display:flex;gap:8px"><button class="btn" id="cs">Save</button><button class="btn ghost" id="cx">Cancel</button></div></div>`;
  $('#curlBox').scrollIntoView({behavior:'smooth',block:'nearest'});
  $('#cx').onclick=()=>$('#curlBox').innerHTML='';
  $('#cs').onclick=()=>{const c=$('#cu').value.trim();if(!/^curl\s/i.test(c))return toast('That does not look like a curl command.');m.curl=c;log('setting','admin','Saved curl for '+m.name);toast('Curl saved (demo, kept in this tab only)');renderView()};
 });
 $('#mt').onclick=LIVE?async()=>{$('#mr').textContent='Checking…';try{const h=await api('GET','/api/admin/health');$('#mr').textContent=(h.store==='mongo'?'MongoDB connected.':'Using the in-memory store (data is lost on restart). Set MONGODB_URI.')}catch(e){$('#mr').textContent=e.message}}:()=>{const ok=/^mongodb(\+srv)?:\/\//.test($('#mg').value.trim());$('#mr').textContent=ok?'Looks valid. A live test runs once the API exists.':'Enter a mongodb:// or mongodb+srv:// string.'};
};

/* ----- Hub Options (admin builds new modules from a Superset curl) ----- */
function curlEndpoint(c){const m=(c||'').match(/https?:\/\/[^\s'"]+/);if(!m)return 'Endpoint not detected';try{const u=new URL(m[0]);return u.host+u.pathname}catch(e){return m[0].slice(0,60)}}
VIEWS.options=v=>{
 const custom=MODULES.filter(m=>m.custom);
 v.innerHTML=`<div class="page-h"><div><h2>Hub Options</h2><p>Add a new tool to the hub from a Superset dashboard curl. It appears in the sidebar and on the home screen for the roles you pick, and gets its own permission column.</p></div></div>
 <form class="card panel" id="of"><h3>New option</h3>
  <div class="toolbar">
   <div class="field" style="flex:2 1 240px"><label for="on">Name</label><input class="inp" id="on" required placeholder="e.g. Agent float balances"></div>
   </div>
  <div class="field"><label>Icon</label><div class="picker">${['dashboard','analytics','payments','account_balance','credit_card','storefront','local_shipping','support_agent','qr_code_2','shield','fact_check','trending_up','badge','inventory_2','phone_iphone','lightbulb'].map((n,i)=>`<label title="${n}"><input type="radio" name="oi" value="${n}" ${i===0?'checked':''}><span class="pk">${ic(n)}</span></label>`).join('')}</div></div>
  <div class="field"><label for="od">Description</label><input class="inp" id="od" placeholder="What people use this for"></div>
  <div class="field"><label for="ofl">Search fields (comma separated)</label><input class="inp" id="ofl" placeholder="Account number, Date range" value="Account number"></div>
  <div class="field"><label for="oc">Superset dashboard curl</label><textarea class="inp mono" id="oc" rows="5" placeholder="curl 'https://superset.example.com/api/v1/dashboard/12/charts' -H 'Authorization: Bearer …'"></textarea>
   <span class="muted" style="font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:400">Leave empty to add the curl later. Once a backend exists, tokens in the curl are kept on the server and never shown in the browser. Only the endpoint is displayed here.</span></div>
  <div class="field"><label>Who gets access</label><div class="demo-users">${['Admin','Supervisor','Agent'].map(r=>`<label class="chip" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" class="orole" value="${r}" ${r==='Admin'?'checked disabled':''}> ${r}</label>`).join('')}</div></div>
  <div class="err" id="oerr"></div>
  <div><button class="btn" type="submit">Create option</button></div></form>
 <div class="card panel"><h3>Your custom options</h3>
  ${custom.length?`<div class="tablewrap"><table><thead><tr><th>Option</th><th>Fields</th><th>Superset endpoint</th><th></th></tr></thead><tbody>${custom.map(m=>`<tr><td><b>${esc(m.name)}</b><div class="muted" style="font-size:12.5px">${esc(m.desc)}</div></td><td>${m.fields.map(f=>`<span class="pill neutral">${esc(f)}</span>`).join(' ')}</td><td class="mono">${m.curl?esc(curlEndpoint(m.curl)):'<span class="pill warn">Awaiting curl</span>'}</td>
   <td class="r"><button class="btn ghost sm" data-open="${m.id}">Open</button> <button class="btn ghost sm" data-ec="${m.id}">${m.curl?'Replace curl':'Add curl'}</button> <button class="btn danger sm" data-del="${m.id}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">Nothing here yet. Options you create will be listed here.</div>'}
  <div id="ebox"></div></div>`;
 $('#of').onsubmit=async e=>{
  e.preventDefault();
  const name=$('#on').value.trim(),curl=$('#oc').value.trim();
  if(MODULES.some(m=>m.name.toLowerCase()===name.toLowerCase()))return $('#oerr').textContent='An option with that name already exists.';
  if(curl&&!/^curl\s/i.test(curl))return $('#oerr').textContent='That does not look like a curl command. It should start with "curl".';
  const roles=['Admin',...$$('.orole:checked').map(x=>x.value)];
  if(LIVE){
   const fields=$('#ofl').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5);
   try{await api('POST','/api/admin/options',{name,ico:($('input[name=oi]:checked')||{value:'dashboard'}).value,desc:$('#od').value.trim(),fields:fields.length?fields:['Search'],curl,roles});toast('Created "'+name+'"');await liveStart();S.route='options';renderShell()}catch(x){$('#oerr').textContent=x.message}
   return;
  }
  const m={id:'c_'+Date.now(),name,ico:($('input[name=oi]:checked')||{value:'dashboard'}).value,desc:$('#od').value.trim()||'Custom Superset dashboard.',custom:true,curl,
   fields:$('#ofl').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,5)};
  if(!m.fields.length)m.fields=['Search'];
  MODULES.push(m);SRC[m.id]='Superset · custom dashboard';
  roles.forEach(r=>{const add=r==='Agent'?[m.id]:[m.id,EXP(m.id)];DEFAULT_PERMS[r].push(...add);USERS.filter(u=>u.role===r).forEach(u=>u.perms.push(...add))});
  log('create','admin','Created option "'+name+'" for '+roles.join(', '));toast('Created "'+name+'"');renderShell();
 };
 $$('[data-open]',v).forEach(b=>b.onclick=()=>go(b.dataset.open));
 $$('[data-del]',v).forEach(b=>b.onclick=()=>{const m=MODULES.find(x=>x.id===b.dataset.del);
  $('#ebox').innerHTML=`<div class="diag"><b>Remove "${esc(m.name)}"?</b><span>It disappears for everyone and its permission column is deleted.</span><div style="display:flex;gap:8px;margin-top:6px"><button class="btn danger sm" id="dy">Remove</button><button class="btn ghost sm" id="dn">Keep</button></div></div>`;
  $('#dn').onclick=()=>$('#ebox').innerHTML='';
  $('#dy').onclick=async()=>{if(LIVE){try{await api('DELETE','/api/admin/options/'+encodeURIComponent(m.id));await liveStart();S.route='options';renderShell()}catch(e){toast(e.message)}return}
   MODULES.splice(MODULES.indexOf(m),1);const gone=p=>p!==m.id&&p!==EXP(m.id);USERS.forEach(u=>u.perms=u.perms.filter(gone));Object.keys(DEFAULT_PERMS).forEach(k=>DEFAULT_PERMS[k]=DEFAULT_PERMS[k].filter(gone));log('delete','admin','Removed option "'+m.name+'"');renderShell()}});
 $$('[data-ec]',v).forEach(b=>b.onclick=()=>{const m=MODULES.find(x=>x.id===b.dataset.ec);
  $('#ebox').innerHTML=`<div class="field"><label for="ecu">New curl for ${esc(m.name)}</label><textarea class="inp mono" id="ecu" rows="4"></textarea></div><div style="display:flex;gap:8px"><button class="btn" id="es">Save curl</button><button class="btn ghost" id="ex">Cancel</button></div>`;
  $('#ex').onclick=()=>$('#ebox').innerHTML='';
  $('#es').onclick=async()=>{const c=$('#ecu').value.trim();if(!/^curl\s/i.test(c))return toast('That does not look like a curl command.');
   if(LIVE){try{await api('PUT','/api/admin/options/'+encodeURIComponent(m.id),{curl:c});toast('Curl saved.')}catch(e){return toast(e.message)}return renderView()}
   m.curl=c;log('setting','admin','Updated curl for '+m.name);renderView()}});
};

function customView(v){
 const m=MODULES.find(x=>x.id===S.route),f=S.filters[m.id]||(S.filters[m.id]={});
 v.innerHTML=head(m.name,m.desc,m.id)+`
 <form class="card panel" id="cf"><div class="toolbar">${m.fields.map((x,i)=>`<div class="field"><label for="cf${i}">${esc(x)}</label><input class="inp" id="cf${i}" value="${esc(f[x]||'')}"></div>`).join('')}<button class="btn" type="submit">Run</button></div></form>
 <div id="cr"></div>`;
 const run=(logIt)=>{
  const vals=m.fields.map((x,i)=>$('#cf'+i).value.trim());m.fields.forEach((x,i)=>f[x]=vals[i]);
  if(logIt)log('search',m.id,m.fields.map((x,i)=>x+': "'+vals[i]+'"').join(', '));
  const s=hash(vals.join('|')||m.id);
  const rows=Array.from({length:5},(_,i)=>{const k=hash(s+'r'+i);return [...m.fields.map((x,j)=>vals[j]||('Sample '+(100+k%900))),money(k%900),pick(['Success','Pending','Failed'],k>>3)]});
  $('#cr').innerHTML=`<div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>Result</h3>${m.curl?`<span class="pill good"><span class="dot"></span>Curl saved · <span class="mono">${esc(curlEndpoint(m.curl))}</span></span>`:'<span class="pill warn"><span class="dot"></span>Awaiting curl</span>'}</div>
  <div style="border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)">The Superset dashboard response will be shown here once the format is added. Sample rows are below.</div>
  <div class="tablewrap"><table><thead><tr>${m.fields.map(x=>`<th>${esc(x)}</th>`).join('')}<th class="r">Value</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.slice(0,-2).map(c=>`<td>${esc(c)}</td>`).join('')}<td class="r num">${r[r.length-2]}</td><td>${pill(r[r.length-1])}</td></tr>`).join('')}</tbody></table></div><div style="display:flex;justify-content:flex-end">${exportBtn(m.id)}</div></div>`;wireExport($('#cr'),m.id);
 };
 $('#cf').onsubmit=e=>{e.preventDefault();run(true)};run(false);
}

/* ========== command palette ========== */
function openCmd(){
 const items=q=>{
  const base=[...MODULES.filter(m=>can(m.id)).map(m=>({l:'Open '+m.name,a:()=>go(m.id)})),...(can('admin')?ADMIN.map(a=>({l:'Open '+a.name,a:()=>go(a.id)})):[])];
  const f=base.filter(i=>i.l.toLowerCase().includes(q.toLowerCase()));
  if(q&&can('search'))f.unshift({l:`Search customers for "${q}"`,a:()=>{S.tab.search=/^\d+$/.test(q)?'id':'name';S.sel.searchQ=q;go('search')}});
  return f;
 };
 $('#overlay').innerHTML=`<div class="cmd-bg" id="cb"><div class="card cmd"><input id="ci" placeholder="Type a module name, or a name or ID to search" autocomplete="off"><ul id="cl"></ul></div></div>`;
 const draw=()=>{const l=items($('#ci').value);$('#cl').innerHTML=l.map((i,n)=>`<li data-n="${n}" class="${n===0?'sel':''}">${esc(i.l)}</li>`).join('')||'<li class="muted">No matches</li>';
  $$('#cl li[data-n]').forEach(li=>li.onclick=()=>{const it=l[+li.dataset.n];close();it.a()});window._cmd=l};
 const close=()=>$('#overlay').innerHTML='';
 $('#ci').oninput=draw;$('#ci').focus();draw();
 $('#cb').onclick=e=>{if(e.target.id==='cb')close()};
 $('#ci').onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&window._cmd[0]){const it=window._cmd[0];close();it.a()}};
}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.user){e.preventDefault();openCmd()}});

/* ========== boot ========== */
LIVE?liveBoot():renderLogin();
</script>
