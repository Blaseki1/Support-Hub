<title>Support Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0,0&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of modules + admin, slim top bar, one working pane. Login is a full-screen gate. */
:root{
  --bg:#e9e9e7; --surface:#ffffff; --surface2:#f1f1ef; --line:#c9c9c4; --fg:#111111; --muted:#4d4d4a;
  --accent:#ffc800; --accent-fg:#111111; --accent-soft:#fff0a8; --accent-ink:#7a5a00;
  --rail:#111111; --rail-fg:#f1f1ee; --rail-muted:#9a9a94; --rail-hover:#222222;
  --on-good:#ffffff; --good:#0f7a36; --good-soft:#d3f1de; --warn:#b34700; --warn-soft:#ffe1c4; --on-bad:#ffffff; --bad:#b3180f; --bad-soft:#fcd9d5; --info:#1f5fbf; --info-soft:#d8e6fb;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.08);
  --f-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0c; --surface:#1a1a1a; --surface2:#242424; --line:#3d3d3a; --fg:#f4f4f1; --muted:#b4b4ae;
  --accent:#ffd21f; --accent-fg:#111111; --accent-soft:#3a3200; --accent-ink:#ffd21f;
  --rail:#000000; --rail-fg:#f4f4f1; --rail-muted:#9a9a94; --rail-hover:#1c1c1c;
  --on-good:#06210f; --good:#5ee08a; --good-soft:#12361f; --warn:#ffa05c; --warn-soft:#432000; --on-bad:#2a0a07; --bad:#ff8f86; --bad-soft:#4a1b17; --info:#7fb0ff; --info-soft:#14284a;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0c; --surface:#1a1a1a; --surface2:#242424; --line:#3d3d3a; --fg:#f4f4f1; --muted:#b4b4ae;
  --accent:#ffd21f; --accent-fg:#111111; --accent-soft:#3a3200; --accent-ink:#ffd21f;
  --rail:#000000; --rail-fg:#f4f4f1; --rail-muted:#9a9a94; --rail-hover:#1c1c1c;
  --on-good:#06210f; --good:#5ee08a; --good-soft:#12361f; --warn:#ffa05c; --warn-soft:#432000; --on-bad:#2a0a07; --bad:#ff8f86; --bad-soft:#4a1b17; --info:#7fb0ff; --info-soft:#14284a;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* icons */
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;width:1em;overflow:hidden;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle;flex:none}
.ms.lg{font-size:30px}
.btn .ms{font-size:18px;margin-right:4px}
/* login */
.gate2{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px max(16px,env(safe-area-inset-left,0px));background-color:#101010;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;color:#f1f1ee}
.g2card{width:100%;max-width:440px;padding:28px;display:grid;gap:16px;border-top:6px solid var(--accent);color:var(--fg)}
.g2top{display:flex;gap:14px;align-items:center}
.g2top .logo{width:52px;height:52px;border-radius:14px}
.g2top .logo .ms{font-size:30px}
.g2top b{font-family:var(--f-display);font-size:22px}
.acct{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.acct:hover,.acct:focus-visible{border-color:var(--fg)}
.acct .avatar{width:30px;height:30px}
.acct .rl{margin-left:auto}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker label{cursor:pointer;position:relative}
.picker input{position:absolute;opacity:0}
.picker span.pk{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.picker input:checked+span.pk{background:var(--accent);border-color:var(--fg);color:var(--accent-fg)}
.picker input:focus-visible+span.pk{outline:3px solid var(--info);outline-offset:2px}
.gate{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.gate-art{background:var(--accent);color:var(--accent-fg);padding:48px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.gate-art h1{font-size:clamp(32px,4.4vw,54px);line-height:1.02;max-width:12ch}
.gate-art .logo{background:var(--accent-fg)!important;color:var(--accent)!important}.gate-art ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;font-family:var(--f-mono);font-size:12.5px;opacity:.9}
.gate-art li::before{content:"› ";}
.gate-form{display:flex;align-items:center;justify-content:center;padding:32px max(20px,env(safe-area-inset-right,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.login-card{width:100%;max-width:400px;padding:28px;display:grid;gap:16px}
.login-card h2{font-size:24px}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.inp{border-color:#8d8d88}.inp:focus{border-color:var(--fg)}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.demo-users{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:12px}
.chip:hover{border-color:var(--fg)}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
.rail{grid-row:1/3;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;min-height:0;overflow:auto}
.brand{color:var(--rail-fg);height:56px;display:flex;align-items:center;gap:10px;padding:0 18px;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-size:14px;font-weight:700}
.nav{padding:6px 10px 16px;display:grid;gap:2px}
.nav h4{margin:16px 8px 4px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-muted);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--rail-fg);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--rail-hover)}
.nav a.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.nav a .ico{width:22px;display:grid;place-items:center;opacity:.95}
.nav a .lock{margin-left:auto;color:var(--rail-muted);display:grid}.nav a .lock .ms{font-size:16px}
.top{display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);min-width:0}
.menu-btn{display:none}
.gsearch{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;color:var(--muted);cursor:pointer;min-width:0}
.gsearch kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;position:relative}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.pop{position:absolute;right:0;top:44px;width:260px;padding:14px;display:grid;gap:10px;z-index:30}
.main{overflow:auto;padding:24px max(24px,env(safe-area-inset-right,0px));min-width:0}
.page{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-h h2{font-size:28px}
.page-h p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}.pill.info{background:var(--info-soft);color:var(--info)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{padding:18px;display:grid;gap:8px;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--fg);transform:translateY(-1px)}
.tile .ti{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500}
.tile h3{font-size:17px}
.tile p{margin:0;color:var(--muted);font-size:13px}
.tile.locked{opacity:.55;cursor:not-allowed}
.tile.locked:hover{transform:none;border-color:var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.panel h3{font-size:16px}

/* forms + tools */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.toolbar .field{flex:1 1 180px;min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface2);padding:4px;border-radius:10px;width:fit-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);font-weight:600;padding:11px 14px;background:var(--surface2);border-bottom:2px solid var(--fg);white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.click:hover td{background:var(--surface2);cursor:pointer}
td.r,th.r{text-align:right}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kv div span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kv div b{font-weight:500;word-break:break-word}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.timeline{display:grid;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.timeline li::before{content:"";position:absolute;left:5px;top:14px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .nd{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:4px;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--accent)}
.timeline .nd.bad{background:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.timeline .nd.warn{background:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.timeline .nd.off{background:var(--surface);box-shadow:0 0 0 2px var(--line)}
.diag{padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bad-soft);color:var(--fg);display:grid;gap:4px}
.diag b{color:var(--bad)}
.src{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface2)}
.empty{padding:36px;text-align:center;color:var(--muted)}
.switch{position:relative;width:62px;height:30px;flex:none;display:inline-block}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:8px;border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12.5px;letter-spacing:.06em}
.switch i::before{content:"OFF"}
.switch input:checked+i{background:var(--good);border-color:var(--good);color:var(--on-good)}
.switch input:checked+i::before{content:"✓ ON"}
.switch input:focus-visible+i{outline:3px solid var(--info);outline-offset:2px}
.switch input:disabled+i{opacity:.4}
.perm{position:relative;width:46px;height:38px;display:inline-block}
.perm input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.perm i{position:absolute;inset:0;border-radius:8px;border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-style:normal;overflow:hidden;transition:transform .1s}
.perm i::before{content:"close";font-family:"Material Symbols Outlined";font-weight:600;font-size:22px;font-feature-settings:"liga"}
.perm input:checked+i{background:var(--good);border-color:var(--good);color:var(--on-good)}
.perm input:checked+i::before{content:"check"}
.perm:hover i{transform:scale(1.06)}
.perm input:focus-visible+i{outline:3px solid var(--info);outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;gap:8px;align-items:center}
.legend .perm{width:28px;height:24px}.legend .perm i::before{font-size:18px}
.legend .perm{pointer-events:none}
.matrix td{padding-block:8px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.matrix .switch{margin:0 auto}
.cmd-bg{position:fixed;inset:0;background:rgba(10,16,24,.5);display:grid;place-items:start center;padding:12vh 16px;z-index:50}
.cmd{width:100%;max-width:540px;overflow:hidden}
.cmd input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;background:transparent;width:100%}
.cmd ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.cmd li{padding:9px 12px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:center}
.cmd li:hover,.cmd li.sel{background:var(--accent);color:var(--accent-fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow)}
.code{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--f-mono);font-size:12px;overflow-x:auto;white-space:pre}
.mask{filter:blur(5px);transition:filter .15s}
.mask:hover{filter:none}


/* login v3 */
.g3{min-height:100%;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg)}
.g3bar{display:flex;align-items:center;gap:12px;padding:18px max(24px,env(safe-area-inset-left,0px));font-family:var(--f-display);font-weight:700;font-size:18px}
.g3mid{display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-left,0px)) 32px}
.g3card{--surface:#1b1b1b;--surface2:#262626;--line:#4d4d49;--fg:#f4f4f1;--muted:#b9b9b3;width:100%;max-width:420px;background:#111;color:var(--fg);border-radius:18px;padding:34px 30px;display:grid;gap:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.g3card .inp{background:var(--surface);color:var(--fg);border-color:#5d5d58;padding:11px 12px}
.g3card .inp:focus{border-color:#ffc800;box-shadow:0 0 0 3px rgba(255,200,0,.25)}
.g3card .btn{background:#ffc800;color:#111;padding:12px 16px;font-size:15px}
.g3card .btn.ghost{background:transparent;color:var(--fg);border:1px solid #5d5d58}
.g3card h2{font-size:28px}
.g3ring{width:64px;height:64px;border-radius:50%;background:#ffc800;color:#111;display:grid;place-items:center}
.g3ring .ms{font-size:32px}
.g3foot{padding:16px max(24px,env(safe-area-inset-left,0px)) 20px;color:var(--muted);font-size:13px;display:flex;gap:18px;flex-wrap:wrap}
.g3foot span{display:inline-flex;gap:6px;align-items:center}
.g3foot .ms{font-size:17px}
/* shared bits */
.pi{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .si{width:46px;height:46px;border-radius:12px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.stat b{font-family:var(--f-display);font-size:28px;line-height:1;display:block}
.stat span.l{color:var(--muted);font-size:13px}
/* permissions */
.permgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:grid;gap:6px;padding:12px;align-content:start}
.pitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border:2px solid transparent;border-radius:10px;background:transparent}
.pitem:hover{background:var(--surface2)}
.pitem.on{border-color:var(--fg);background:var(--accent-soft)}
.pitem .meta{min-width:0;flex:1}
.pitem .meta b,.pitem .meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 8px;border-bottom:2px solid var(--fg);flex-wrap:wrap}
.pgh h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--f-body);font-weight:700}
.prow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.prow .pt{flex:1 1 220px;min-width:0}
.prow .pt b{display:block}
.pctl{display:flex;gap:14px;flex-wrap:wrap}
.pc{display:grid;gap:3px}
.pc small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.seg button+button{border-left:2px solid var(--line)}
.seg button:hover:not([disabled]){background:var(--surface2)}
.seg button.yes.on{background:var(--good);color:var(--on-good)}
.seg button.no.on{background:var(--bad);color:var(--on-bad)}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg .ms{font-size:16px;width:16px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}

async function api(method,url,body,opts){
 const r=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'hub'},body:body===undefined?undefined:JSON.stringify(body),signal:opts&&opts.signal});
 let d=null;try{d=await r.json()}catch(e){}
 if(!r.ok){
  const err=new Error((d&&d.error)||('Request failed ('+r.status+')'));err.status=r.status;err.code=d&&d.code;
  if(r.status===401&&!(opts&&opts.noAuthRedirect)&&S.user){S.user=null;S.cache={};renderLogin('Your session ended. Sign in again.')}
  throw err;
 }
 return d;
}

async function liveLogin(e){
 e.preventDefault();const btn=e.target.querySelector('button[type=submit]');if(btn)btn.disabled=true;
 try{
  await api('POST','/api/auth/login',{email:$('#em').value.trim(),password:$('#pw').value},{noAuthRedirect:true});
  await liveStart();
 }catch(x){renderLogin(x.message)}
}
async function liveStart(){
 const b=await api('GET','/api/bootstrap',undefined,{noAuthRedirect:true});
 applyBootstrap(b);
 if(b.user.mustChange)return renderChangePw(true);
 S.route='home';renderShell();
}
function applyBootstrap(b){
 S.user=b.user;S.session={id:'me'};S.recent=b.recent||[];S.searchCount=b.searchCount||0;
 for(let i=MODULES.length-1;i>=0;i--)if(MODULES[i].custom)MODULES.splice(i,1);
 (b.options||[]).forEach(o=>{MODULES.push({id:o.id,name:o.name,ico:o.ico,desc:o.desc,custom:true,fields:o.fields,curl:o.url?('curl '+o.url):''});SRC[o.id]='Superset · custom dashboard'});
 Object.entries((b.settings||{}).connections||{}).forEach(([k,c])=>{if(SUP[k])Object.assign(SUP[k],{env:c.env,timeoutSec:c.timeoutSec,minChars:c.minChars,searchCols:c.searchCols})});
}

 api('GET','/api/bootstrap',undefined,{noAuthRedirect:true}).then(b=>{applyBootstrap(b);if(b.user.mustChange)renderChangePw(true);else renderShell()}).catch(()=>renderLogin());

  </form></div><div class="g3foot"></div></div>`;

 };

/* Several people can be signed in at once. Each has their own session and place in the app; nobody is signed out by someone else signing in. */
function saveCurrent(){const cur=S.open.find(o=>o.session===S.session);if(cur)cur.route=S.route}
function switchTo(entry){
 saveCurrent();S.user=entry.user;S.session=entry.session;S.route=entry.route||'home';S.popOpen=false;S.navOpen=false;S.mask=false;renderShell();
}
function closeEntry(entry){
 S.open=S.open.filter(o=>o!==entry);SESSIONS=SESSIONS.filter(s=>s.id!==entry.session.id);
}
function logout(){
 if(LIVE){api('POST','/api/auth/logout',undefined,{noAuthRedirect:true}).catch(()=>{}).finally(()=>{S.user=null;S.session=null;S.popOpen=false;S.navOpen=false;S.cache={};S.filters={};S.sel={};renderLogin()});return}
 log('logout','auth','Signed out');
 const cur=S.open.find(o=>o.session===S.session);closeEntry(cur);S.popOpen=false;S.navOpen=false;
 if(S.open.length){const n=S.open[S.open.length-1];S.user=n.user;S.session=n.session;S.route=n.route||'home';S.mask=false;toast('Signed out. Switched to '+n.user.name.split(' ')[0]);renderShell()}
 else{S.user=null;S.session=null;renderLogin()}
}

 </div>`;
 $$('[data-go]').forEach(a=>a.onclick=()=>go(a.dataset.go));

 }

function go(r){

const mapSession=x=>({id:x.id,uid:x.uid,uname:x.uname,device:x.device,ip:x.ip,since:fmtStamp(x.createdAt),seen:agoStr(x.lastSeen),current:!!x.current});

 sources:async()=>{const c=await api('GET','/api/admin/connections');SUPAUTH=c.auth||{};Object.entries(c.connections).forEach(([k,v])=>{SUP[k]=v})},
 options:async()=>{const o=await api('GET','/api/admin/options');for(let i=MODULES.length-1;i>=0;i--)if(MODULES[i].custom)MODULES.splice(i,1);o.options.forEach(x=>{MODULES.push({id:x.id,name:x.name,ico:x.ico,desc:x.desc,custom:true,fields:x.fields,curl:x.url?('curl '+x.url):''});SRC[x.id]='Superset · custom dashboard'})}
};

}

 {k:'FIRST_NAME',label:'First name',ph:'e.g. Carlos',g:'Name'},

 {k:'LAST_NAME',label:'Last name',ph:'e.g. Ross',g:'Name'},

function synthAccount(seed,v){
 v=v||{};const k=hash(seed);
 const un=v.USER_NAME||(v.MOBILE_NUMBER?String(v.MOBILE_NUMBER).replace(/^592/,''):String(6000000+k%999999));
 return {USER_ID:String(100000+k%899999),PARTNER_ID:String(200000+(k>>>3)%799999),STATUS:pick(['Active','Active','InActive','Terminated'],k>>>2),Account_type:pick(['Customer','Customer','Customer','Merchant','Agent'],k>>>5),
  USER_NAME:un,MOBILE_NUMBER:v.MOBILE_NUMBER||('592'+un),FIRST_NAME:v.FIRST_NAME||pick(FIRST,k),Middle_name:v.Middle_name||null,LAST_NAME:v.LAST_NAME||pick(LAST,k>>>3),
  DOB:Date.UTC(1965+k%38,k%12,1+k%27),EMAIL_ID:v.EMAIL_ID||('user'+un+'@example.com'),CREATED_DATE:Date.UTC(2019+k%7,k%12,1+(k>>>4)%27),CREATED_BY:'initial_load',LAST_MODIFIED_DATE:null,LAST_MODIFIED_BY:null,
  IDENTIFICATION_TYPE:pick(['Nationalid','Licence','Passport'],k>>>6),ID_NUMBER:v.ID_NUMBER||(pick(['R','D','P'],k>>>7)+String(1000000+k%8999999)),PLACE_OF_ISSUE:null};
}
/* Preview stand-in. The exported project calls the server, which calls Superset. */
function synthSearch(vals){
 const s=hash(JSON.stringify(vals)),unique=['ID_NUMBER','USER_NAME','MOBILE_NUMBER','EMAIL_ID'].some(c=>vals[c]);
 const n=unique?1:1+s%3;
 return Array.from({length:n},(_,i)=>synthAccount(s+'a'+i,i===0?vals:{...vals,USER_NAME:undefined,MOBILE_NUMBER:undefined,ID_NUMBER:undefined,EMAIL_ID:undefined}));
}
async function searchRows(vals,match){
 if(LIVE)return api('POST','/api/search',{filters:vals,match});
 await new Promise(r=>setTimeout(r,450));
 return {rows:synthSearch(vals),total:null,truncated:false,env:SUP['search.lookup'].env,at:now(),match};
}

function feeResult(id){
 const s=hash(id),amt=50+s%950,fee=+(amt*0.015).toFixed(2),comm=+(fee*0.4).toFixed(2),rev=s%3;
 const st=['Success','Failed','Reversed'][rev];
 const reasons=[
  null,
  ['Debit succeeded but the credit leg timed out at the partner.','Auto-reversal was queued but skipped: the partner returned a non-final status.','Retry window ends in 4 hours. Manual reversal is available to supervisors.'],
  ['Reversal posted to the wallet.','Fee of '+money(fee)+' was refunded with the principal.','Commission of '+money(comm)+' clawed back from the agent.']];
 return `<div class="two">
  <div class="card panel"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${esc(id)}</h3>${pill(st)}</div>
   <div class="kv"><div><span>Amount</span><b class="num">${money(amt)}</b></div><div><span>Type</span><b>${pick(['Wallet transfer','Cash out','Bill payment'],s)}</b></div><div><span>Initiated</span><b>19 Oct 2026, ${10+s%8}:${10+s%49}</b></div></div>
   <div class="tablewrap"><table style="min-width:0"><thead><tr><th>Line</th><th class="r">Amount</th></tr></thead><tbody>
    <tr><td>Principal</td><td class="r num">${money(amt)}</td></tr><tr><td>Service fee (1.5%)</td><td class="r num">${money(fee)}</td></tr>
    <tr><td>Agent commission</td><td class="r num">${money(comm)}</td></tr><tr><td>Platform margin</td><td class="r num">${money(fee-comm)}</td></tr>
    <tr><td><b>Customer paid</b></td><td class="r num"><b>${money(amt+fee)}</b></td></tr></tbody></table></div></div>
  <div class="card panel"><h3>Reversal check</h3>
   ${rev===1?`<div class="diag"><b>Not reversed</b><span>The transaction failed after the debit. Funds are still held.</span></div>`:`<div class="pill ${rev===2?'neutral':'good'}" style="width:fit-content">${rev===2?'Reversed':'No reversal needed'}</div>`}
   <ul class="timeline">${(reasons[rev]||['Debit and credit both completed.','No reversal rules triggered.']).map((t,i,a)=>`<li><span class="nd ${rev===1&&i<2?'bad':''}"></span><div>${esc(t)}</div></li>`).join('')}</ul>
   <div class="muted" style="font-size:12.5px">Reason text is placeholder until the reversal curl is connected.</div></div></div>`;
}

function buildBody(q,vals,range){

/* Reads a pasted curl and returns the settings in it. The Cookie header is never read. */
function parseCurl(text){
 const um=String(text).match(/https?:\/\/[^\s'"\\]+/);if(!um)return {error:'No URL found in that curl.'};
 let url;try{url=new URL(um[0])}catch(e){return {error:'The URL in that curl is not valid.'}}
 const i=text.indexOf('--data'),a=text.indexOf('{',i),b=text.lastIndexOf('}');
 if(i<0||a<0||b<a)return {error:'No JSON body (--data) found in that curl.'};
 let j;try{j=JSON.parse(text.slice(a,b+1))}catch(e){return {error:'The --data body is not valid JSON.'}}
 const qq=(j.queries||[])[0]||{},fd=j.form_data||{},fl=qq.filters||[];
 return {base:url.origin,endpoint:url.pathname,datasource:j.datasource&&j.datasource.id,slice:fd.slice_id,dashboard:fd.dashboardId,
  rowLimit:qq.row_limit||fd.row_limit,columns:qq.columns||[],orderBy:qq.orderby||[],fixedFilters:fl.filter(f=>!('val' in f)).map(f=>({col:f.col,op:f.op})),searchCols:[...new Set(fl.filter(f=>f.op==='IN').map(f=>f.col))],dateCol:(fl.find(f=>f.op==='TEMPORAL_RANGE')||{}).col||''};
}

function demoHistory(a,pr){

 const days=Math.max(1,Math.round((end-start)/864e5)),n=Math.min(80,Math.max(6,days*2)),seed=hash(a.PARTNER_ID+pr.range),rows=[];

   WALLET_ID:String(300000+k2%99999),WALLET_PARTNER_ID:a.PARTNER_ID,WALLET_TYPE_ID:1,WALLET_SIDE:side,WALLET_NET_AMOUNT:ok?net:0,TRANSACTION_AMOUNT:side==='OP'?-amt:amt,

  $('#tcount').textContent=`${rows.length} of ${res().rows.length} shown`;
  box.innerHTML=rows.length?`<div class="tablewrap"><table style="min-width:1000px"><thead><tr><th style="width:64px">Select</th><th>User ID</th><th>Name</th><th>Username</th><th>Mobile</th><th>Email</th><th>Account type</th><th>Status</th><th>Created</th><th>Created by</th><th>Last modified</th></tr></thead><tbody>
   ${rows.map(r=>`<tr class="click" data-row="${esc(r.USER_ID)}"><td><input type="radio" name="tacct" data-pk="${esc(r.USER_ID)}" ${S.sel.txnAcct===r.USER_ID?'checked':''} aria-label="Select ${esc(r.USER_NAME)}"></td><td class="mono">${esc(r.USER_ID)}<div class="muted">Partner ${esc(r.PARTNER_ID)}</div></td><td><b>${esc(r.FIRST_NAME)} ${esc(r.Name)}</b></td><td class="mono">${esc(r.USER_NAME)}</td><td class="mono">${esc(r.MOBILE_NUMBER||'—')}</td><td>${esc(r.EMAIL_ID||'—')}</td><td>${esc(r.Account_type)}</td><td>${pill(r.STATUS)}</td><td class="num">${fmtDate(r.CREATED_DATE)}</td><td class="mono">${esc(r.CREATED_BY||'—')}</td><td class="num">${fmtDate(r.LAST_MODIFIED_DATE)}</td></tr>`).join('')}</tbody></table></div>`
   :'<div class="card empty">No accounts match these filters.</div>';
  $$('[data-row]',box).forEach(tr=>tr.onclick=()=>{const id=tr.dataset.row;if(S.sel.txnAcct===id)return;S.sel.txnAcct=id;S.cache.hist=null;const hr=$('#hres');if(hr)hr.innerHTML='';drawTable();upd2()});
 };
 const upd2=()=>{
  const a=acct(),el=$('#hsel');
  if(el)el.innerHTML=a?`<b>${esc(a.FIRST_NAME)} ${esc(a.Name)}</b> · username <span class="mono">${esc(a.USER_NAME)}</span> · Partner ID <span class="mono">${esc(a.PARTNER_ID)}</span>`:'<span class="muted">No account selected. Tick one in the table above.</span>';
  const b=$('#h2go');if(b)b.disabled=!a;
 };

 const drawHist=()=>{
  const box=$('#hres'),c=S.cache.hist;if(!box)return;if(!c){box.innerHTML='';return}
  const ok=c.ok,bad=c.bad,lim=Number(c.rowLimit)||0;
  const canDl=can('export:txns');
  if(!c.total){box.innerHTML=`<div class="card empty"><b>No transactions found</b><div>${esc(c.label)} for Partner ID ${esc(c.pid)} returned nothing. Try a longer period.</div></div>`;return}
  const pv=c.preview;
  box.innerHTML=`<div class="card panel" style="background:var(--surface2)">
   <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h3>${fmtN(c.total)} transactions</h3><div class="muted" style="font-size:13px">${esc(c.label)} · Partner ID <span class="mono">${esc(c.pid)}</span> · ${c.env.toUpperCase()} · pulled ${esc(c.at)}</div></div>
    <button class="btn" id="xl" ${canDl?'':'disabled title="Ask an admin for export access"'}>${ic(canDl?'download':'lock')}Download Excel</button></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill good"><span class="dot"></span>${fmtN(ok)} success</span><span class="pill ${bad?'bad':'neutral'}"><span class="dot"></span>${fmtN(bad)} failure</span>${lim&&c.total>=lim?`<span class="pill warn"><span class="dot"></span>Row limit of ${fmtN(lim)} reached. Pick a shorter period.</span>`:''}</div>
   <div class="tablewrap" style="background:var(--surface)"><table style="min-width:900px"><thead><tr><th>Date and time</th><th>Transaction ID</th><th>Service</th><th>Status</th><th>Side</th><th class="r">Amount</th><th class="r">Net</th><th class="r">Balance before</th><th class="r">Balance after</th><th>Other party</th></tr></thead><tbody>
   ${pv.map(r=>`<tr><td class="num">${esc(fmtIso(r.TRANSACTION_DATE))}</td><td class="mono">${esc(r.TRANSACTION_ID)}</td><td>${esc(r.SERVICE_NAME)}</td><td>${pill(r.STATUS_TYPE)}</td><td>${esc(r.WALLET_SIDE)}</td><td class="r num">${fmtN(r.TRANSACTION_AMOUNT)}</td><td class="r num">${fmtN(r.WALLET_NET_AMOUNT)}</td><td class="r num">${fmtN(r.WALLET_BAL_BEFORE)}</td><td class="r num">${fmtN(r.WALLET_BAL_AFTER)}</td><td>${esc(r.OTHER_USER_FULL_NAME||'—')}</td></tr>`).join('')}</tbody></table></div>
   <div class="muted" style="font-size:13px">Showing the first ${pv.length}. The Excel file has all ${fmtN(c.total)} rows and all ${HIST_COLS.length} columns. Amounts are shown as returned by Superset.</div></div>`;
  const xb=$('#xl');
  if(xb)xb.onclick=async()=>{
   const a=res().rows.find(r=>r.USER_ID===c.acct)||{};
   const safe=s=>String(s).replace(/[^\w-]+/g,'');
   const fname=`transactions_${safe(a.USER_NAME||c.pid)}_${safe(c.per)}_${new Date().toISOString().slice(0,10)}.xlsx`;
   if(LIVE){
    xb.disabled=true;toast('Preparing Excel file…');
    try{await downloadServer('/api/txns/history/'+encodeURIComponent(c.pullId)+'/xlsx',fname);toast('Saved '+fname)}catch(e){toast(e.message||'Could not download the file.')}
    xb.disabled=!can('export:txns');return;
   }
   if(typeof XLSX==='undefined'){toast('The Excel library did not load. Reload the page and try again.');return}
   xb.disabled=true;toast('Preparing Excel file…');
   await new Promise(r=>setTimeout(r,30));
   try{
    const info=[['Account',(a.FIRST_NAME||'')+' '+(a.Name||'')],['Username',a.USER_NAME||''],['Mobile number',a.MOBILE_NUMBER||''],['Partner ID',c.pid],['Period',c.label],['Date filter sent',c.range],['Environment',c.env.toUpperCase()],['Rows',c.total],['Pulled at',c.at],['Pulled by',S.user.name]];
    const buf=buildXlsx(XLSX,HIST_COLS,c.all,info);
    await saveFile(fname,buf,'txns',`Downloaded ${c.total} transactions for ${a.USER_NAME||c.pid} (Partner ${c.pid}), ${c.label}`);
   }catch(e){toast('Could not build the Excel file.')}
   xb.disabled=!can('export:txns');
  };
 };

 const pull=async()=>{
  const a=acct();if(!a)return;
  const hr=$('#hres'),go=$('#h2go'),sec=Math.max(5,Number(h.timeoutSec)||60);
  if(!LIVE&&!supUrl(h)){hr.innerHTML=`<div class="diag"><b>No ${h.env.toUpperCase()} URL</b><span>The transaction history connection has no URL yet.${can('admin')?' Add it under Data Sources.':' Ask an admin to add it.'}</span></div>`;return}
  const per=$('#h2p').value,pr=periodRange(per),label=PERIODS.find(p=>p[0]===per)[1];
  S.sel.txnPer=per;S.cache.hist=null;
  log('search','txns',`Transaction history: ${a.USER_NAME} (Partner ID ${a.PARTNER_ID}), ${label}`);
  const ctl=new AbortController(),t0=Date.now();let why='';
  go.disabled=true;
  hr.innerHTML=`<div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><b>Pulling transactions…</b><span class="mono" id="hel">0s of ${sec}s</span></div><div class="bar"><i id="hbar" style="width:0"></i></div>
   <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span class="muted" style="font-size:13px">Long periods can take a while. This stops after ${sec} seconds.</span><button class="btn ghost sm" id="hcx" type="button">Cancel</button></div></div>`;
  const tick=setInterval(()=>{const s=Math.min(sec,Math.floor((Date.now()-t0)/1000)),e=$('#hel'),b=$('#hbar');if(e)e.textContent=s+'s of '+sec+'s';if(b)b.style.width=(s/sec*100)+'%'},250);
  const to=setTimeout(()=>{why='timeout';ctl.abort()},(sec+(LIVE?10:0))*1000);
  $('#hcx').onclick=()=>{why='cancel';ctl.abort()};
  try{
   let c;
   if(LIVE){const d=await api('POST','/api/txns/history',{partnerId:a.PARTNER_ID,period:per},{signal:ctl.signal});c={acct:a.USER_ID,pid:a.PARTNER_ID,per,label,...d}}
   else{
    const body=buildBody(h,[a.PARTNER_ID],pr.range);
    const rows=await fetchHistory(body,demoHistory(a,pr),ctl.signal);
    c={acct:a.USER_ID,pid:a.PARTNER_ID,per,label,...histSummary(rows),all:rows,at:now(),range:pr.range,env:h.env,rowLimit:Number(supActive(h).rowLimit)||0};
   }
   S.cache.hist=c;
   if($('#hres'))drawHist();
  }catch(e){
   if(e&&e.code==='timeout')why='timeout';
   const box=$('#hres');
   if(box)box.innerHTML=why==='timeout'
    ?`<div class="diag"><b>The request timed out after ${sec} seconds</b><span>Superset did not answer in time. Try a shorter period.${can('admin')?' You can raise the timeout under Data Sources.':' An admin can raise the timeout.'}</span></div>`
    :why==='cancel'?'<div class="card empty">Cancelled.</div>':`<div class="diag"><b>Could not pull transactions</b><span>${esc(e.message||'Unknown error')}</span></div>`;
   if(why==='timeout')log('error','txns',`Transaction history timed out after ${sec}s: ${a.USER_NAME}, ${label}`);
  }finally{clearInterval(tick);clearTimeout(to);const g=$('#h2go');if(g)g.disabled=!acct()}
 };

 const drawRes=()=>{
  const box=$('#tres');if(!box)return;const r=res();
  if(!r){box.innerHTML='<div class="card empty">Enter a username or mobile number above to pull accounts.</div>';return}
  const searched=r.vals.map(x=>'"'+esc(x)+'"').join(' and ');
  if(!r.rows.length){box.innerHTML=`<div class="card empty"><b>No accounts found for "${esc(r.val)}"</b><div>Searched ${searched} on ${esc(q.searchCols.join(' and '))}. Check the number and try again.</div></div>`;return}
  const statuses=[...new Set(r.rows.map(x=>x.STATUS))],types=[...new Set(r.rows.map(x=>x.Account_type))];
  const cnt=s=>r.rows.filter(x=>x.STATUS===s).length;
  box.innerHTML=`<div style="display:grid;gap:14px;grid-template-columns:minmax(0,1fr)">
  ${LIVE?'':'<div class="src"><span><b>Preview data.</b> This page is not connected to Superset here, so these accounts and transactions are made up to show the layout.</span></div>'}
  ${r.truncated?`<div class="diag"><b>Row limit reached</b><span>Superset returned its maximum of ${fmtN(r.limit)} rows, so some accounts may be missing. Use a longer number.</span></div>`:''}
  <div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h3>${r.rows.length} account${r.rows.length===1?'':'s'} found</h3><div class="muted" style="font-size:13px">Searched ${searched} · ${r.env.toUpperCase()} · pulled ${esc(r.at)} · <span id="tcount"></span></div></div>${exportBtn('txns')}</div>
   <div class="toolbar">
    <div class="field" style="flex:2 1 260px"><label>Status</label><div class="picker" style="gap:6px">${statuses.map(s=>`<label><input type="checkbox" data-st="${esc(s)}" ${f.status.includes(s)?'checked':''}><span class="chip" style="display:inline-block;cursor:pointer">${esc(s)} · ${cnt(s)}</span></label>`).join('')}</div></div>
    <div class="field"><label for="ft">Account type</label><select class="inp" id="ft"><option>All</option>${types.map(t=>`<option ${f.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div class="field"><label for="ff1">Created from</label><input class="inp" id="ff1" type="date" value="${esc(f.from)}"></div>
    <div class="field"><label for="ff2">Created to</label><input class="inp" id="ff2" type="date" value="${esc(f.to)}"></div>
    <div class="field"><label for="fx">Find in results</label><input class="inp" id="fx" value="${esc(f.text)}" placeholder="Name, ID, partner…"></div>
    <button class="btn ghost" type="button" id="fclr">Clear filters</button></div></div>
  <div id="ttab"></div>
  <div class="card panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3>Transaction history</h3><span style="display:flex;gap:6px">${envPill(h)}</span></div>
   <div id="hsel"></div>
   <div class="toolbar"><div class="field" style="flex:0 1 240px"><label for="h2p">Period</label><select class="inp" id="h2p">${PERIODS.map(p=>`<option value="${p[0]}" ${(S.sel.txnPer||'30')===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></div>
    <button class="btn" id="h2go" type="button">${ic('cloud_download')}Pull transactions</button></div>
   <div id="hres"></div></div></div>`;
  $$('[data-st]',box).forEach(c=>c.onchange=()=>{f.status=c.checked?[...f.status,c.dataset.st]:f.status.filter(x=>x!==c.dataset.st);drawTable()});
  $('#ft').onchange=e=>{f.type=e.target.value;drawTable()};
  $('#ff1').onchange=e=>{f.from=e.target.value;drawTable()};$('#ff2').onchange=e=>{f.to=e.target.value;drawTable()};
  $('#fx').oninput=e=>{f.text=e.target.value;drawTable()};
  $('#fclr').onclick=()=>{S.filters.txns={status:[],type:'All',from:'',to:'',text:''};Object.assign(f,S.filters.txns);drawRes()};
  $('#h2go').onclick=pull;
  $('#h2p').onchange=()=>{S.cache.hist=null;S.sel.txnPer=$('#h2p').value;const hr=$('#hres');if(hr)hr.innerHTML=''};
  wireExport(box,'txns',()=>{const rows=filtered();
   return {filename:`accounts_${r.val.replace(/[^\w-]/g,'')}_${new Date().toISOString().slice(0,10)}.csv`,
    data:toCsv(LOOKUP_COLS,rows.map(x=>({...x,CREATED_DATE:fmtIso(x.CREATED_DATE),LAST_MODIFIED_DATE:fmtIso(x.LAST_MODIFIED_DATE)}))),detail:`Downloaded ${rows.length} account row(s) for "${r.val}"`}});
  drawTable();upd2();drawHist();
 };

 const run=async(pre)=>{
  const val=$('#tq').value.trim();S.sel.txnQ=val;
  if(val.length<q.minChars){$('#terr').textContent=`Enter at least ${q.minChars} characters of the username or mobile number.`;return}
  if(!LIVE&&!supUrl(q)){$('#terr').textContent=`The ${q.env.toUpperCase()} connection has no URL yet.`+(can('admin')?' Add it under Data Sources.':' Ask an admin to add it.');return}
  $('#terr').textContent='';
  const vals=variants(val);
  log('search','txns','Account lookup: "'+val+'"');
  $('#tres').innerHTML='<div class="card empty">Looking up accounts…</div>';
  let d;
  try{
   if(LIVE)d=await api('POST','/api/txns/lookup',{value:val});
   else{await new Promise(r=>setTimeout(r,450));d={rows:lookupDemo(q,vals),vals,env:q.env,at:now()}}
  }catch(x){if($('#tres'))$('#tres').innerHTML=`<div class="diag"><b>Lookup failed</b><span>${esc(x.message||'Unknown error')}</span></div>`;return}
  if(S.route!=='txns'||!$('#tres'))return;
  const rows=d.rows;
  S.cache.txns={val,vals:d.vals||vals,rows,at:d.at||now(),env:d.env||q.env,truncated:!!d.truncated,limit:d.limit};S.cache.hist=null;
  S.sel.txnAcct=(pre&&rows.some(r=>r.USER_ID===pre))?pre:(rows.length===1?rows[0].USER_ID:null);
  S.filters.txns={status:[],type:'All',from:'',to:'',text:''};Object.assign(f,S.filters.txns);
  drawRes();
 };
 $('#tf').onsubmit=e=>{e.preventDefault();run()};
 if(S.sel.txnAuto){const id=S.sel.txnAuto;S.sel.txnAuto=null;run(id)}else drawRes();
};
